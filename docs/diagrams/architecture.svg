<rect x="856.8000000000001" y="576" width="90.8" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="902.2" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0">Wikimedia</text>
<rect x="955.6" y="576" width="69.2" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="990.2" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0">FFmpeg</text>
