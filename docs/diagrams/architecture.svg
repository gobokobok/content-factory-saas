<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="How the platform is put together">
<rect width="1200" height="640" rx="12" fill="#FAFAFA" stroke="#E7E7E9"/>
<text x="48" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#8B8B92">CONTENT FACTORY · SYSTEM</text>
<text x="48" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4" fill="#121215">How the platform is put together</text>
<rect x="48" y="108" width="1104" height="84" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="64" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">BROWSER</text>
<text x="64" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">One page, /create, in plain HTML and JavaScript</text>
<text x="64" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">No frontend framework and no build step. Super screens are loaded only for a Super session.</text>
<rect x="760" y="137" width="170" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="845.0" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="10.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0.3">BASIC · CREATOR FLOW</text>
<rect x="940" y="137" width="196" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="1038.0" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="10.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0.3">SUPER · PROJECTS, LIBRARIES</text>
<line x1="600" y1="192" x2="600" y2="216" stroke="#2743C9" stroke-width="1.5"/><path d="M595 215 L600 222 L605 215 Z" fill="#2743C9"/>
<rect x="48" y="222" width="1104" height="168" rx="8" fill="#FFFFFF" stroke="#E7E7E9"/>
<text x="64" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">FASTAPI · PYTHON 3.11 · ONE SERVICE ON RAILWAY</text>
<rect x="64.0" y="262" width="259.0" height="108" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="78.0" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Sign-in and accounts</text>
<text x="78.0" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Google only, invite list,</text>
<text x="78.0" y="331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">per-account isolation</text>
<rect x="335.0" y="262" width="259.0" height="108" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="349.0" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Access gate</text>
<text x="349.0" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Basic is an allow-list;</text>
<text x="349.0" y="331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">everything else needs Super</text>
<rect x="606.0" y="262" width="259.0" height="108" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="620.0" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Credits and limits</text>
<text x="620.0" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Hold, then settle or refund;</text>
<text x="620.0" y="331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">daily caps, render gate</text>
<rect x="877.0" y="262" width="259.0" height="108" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="891.0" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Moderation</text>
<text x="891.0" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Two layers with a log,</text>
<text x="891.0" y="331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">for text and images</text>
<line x1="600" y1="390" x2="600" y2="414" stroke="#2743C9" stroke-width="1.5"/><path d="M595 413 L600 420 L605 413 Z" fill="#2743C9"/>
<rect x="48" y="420" width="520" height="112" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="64" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">LANGGRAPH</text>
<text x="64" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">36 workers as pure, stateless nodes</text>
<text x="64" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Routing and loop bounds sit on the graph edges.</text>
<text x="64" y="509" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">A run pauses at a human gate and resumes from a checkpoint.</text>
<rect x="580" y="420" width="280" height="112" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="596" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">POSTGRES</text>
<text x="596" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Index and ledger</text>
<text x="596" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Accounts, runs, artifacts,</text>
<text x="596" y="509" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">credits, checkpoints</text>
<rect x="872" y="420" width="280" height="112" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="888" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">CLOUDFLARE R2</text>
<text x="888" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Artifact store</text>
<text x="888" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Scripts, storyboards,</text>
<text x="888" y="509" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">images, voice, renders</text>
<line x1="308" y1="532" x2="308" y2="556" stroke="#2743C9" stroke-width="1.5"/><path d="M303 555 L308 562 L313 555 Z" fill="#2743C9"/>
