<rect x="449.2" y="576" width="83.6" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="491.0" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0">Deepgram</text>
<rect x="540.8" y="576" width="69.2" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="575.4" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0">kie.ai</text>
<rect x="618.0" y="576" width="69.2" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="652.6" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0">OpenAI</text>
<rect x="695.2" y="576" width="69.2" height="26" rx="13" fill="#FAFAFA" stroke="#E7E7E9"/><text x="729.8000000000001" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#55555C" text-anchor="middle" letter-spacing="0">Pexels</text>
