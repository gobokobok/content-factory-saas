<circle cx="599.5" cy="262" r="4" fill="#2743C9"/>
<circle cx="758.5" cy="262" r="4" fill="#2743C9"/>
<text x="520.0" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#121215" text-anchor="middle" letter-spacing="1.2">A PERSON APPROVES THE SCRIPT, THE STORYBOARD AND THE ASSETS</text>
<rect x="50.0" y="350" width="542.5" height="78" rx="8" fill="#FFFFFF" stroke="#E7E7E9"/>
<text x="66.0" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">STORAGE</text>
<text x="66.0" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Every artifact goes to Cloudflare R2 and is indexed in Postgres,</text>
<text x="66.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">so any step can be inspected, retried or resumed.</text>
<rect x="606.5" y="350" width="542.5" height="78" rx="8" fill="#FFFFFF" stroke="#E7E7E9"/>
<text x="622.5" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="1.2">CREDITS</text>
<text x="622.5" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">A hold is placed before each paid call, then settled at the real</text>
<text x="622.5" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">cost or refunded if the call fails. Hard limits per account.</text>
</svg>
