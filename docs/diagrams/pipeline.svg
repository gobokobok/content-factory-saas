<text x="221" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0">02</text>
<text x="221" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Script</text>
<text x="221" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Write, fact-check,</text>
<text x="221" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">patch, re-score</text>
<text x="221" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="9.5" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0.4">CLAUDE</text>
<rect x="368" y="112" width="145" height="150" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="380" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0">03</text>
<text x="380" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Voice</text>
<text x="380" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">TTS or upload,</text>
<text x="380" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">word timestamps</text>
<text x="380" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="9.5" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0.4">GEMINI · DEEPGRAM</text>
