<text x="62" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Idea</text>
<text x="62" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Trends, Reddit,</text>
<text x="62" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">YouTube; scored</text>
