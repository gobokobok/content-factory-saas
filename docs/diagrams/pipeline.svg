<text x="539" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0">04</text>
<text x="539" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Storyboard</text>
<text x="539" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Scenes cut on real</text>
<text x="539" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">speech boundaries</text>
<text x="539" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="9.5" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0.4">CLAUDE</text>
<rect x="686" y="112" width="145" height="150" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="698" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0">05</text>
<text x="698" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Assets</text>
<text x="698" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">AI images or stock</text>
<text x="698" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">in one style</text>
<text x="698" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="9.5" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0.4">KIE · OPENAI · STOCK</text>
<rect x="845" y="112" width="145" height="150" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="857" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0">06</text>
<text x="857" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Render</text>
<text x="857" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Captions, music,</text>
<text x="857" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">motion, two ratios</text>
<text x="857" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="9.5" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0.4">FFMPEG · CAPCUT</text>
<rect x="1004" y="112" width="145" height="150" rx="8" fill="#F0F0F2" stroke="#E7E7E9"/>
<text x="1016" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0">07</text>
<text x="1016" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#121215" text-anchor="start" letter-spacing="0">Metadata</text>
<text x="1016" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">Title, tags,</text>
<text x="1016" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#55555C" text-anchor="start" letter-spacing="0">description</text>
<text x="1016" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="9.5" font-weight="400" fill="#8B8B92" text-anchor="start" letter-spacing="0.4">CLAUDE</text>
