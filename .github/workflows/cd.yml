name: CD — Deploy to PROD

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately: an unpinned global install is what left the
      # operator's local CLI half-installed and unusable (D077).
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.45.2

      # Stamps the commit + tag into the upload so GET /platform/version can
      # report what is actually running. Must run BEFORE `railway up`, and the
      # file must stay git-tracked — the CLI honours .gitignore when uploading,
      # so an ignored stamp would be silently dropped (D077).
      - name: Stamp build info
        run: |
          printf '{"commit": "%s", "version": "%s"}\n' \
            "$(git rev-parse --short HEAD)" "${GITHUB_REF_NAME}" > build_info.json
          cat build_info.json

      # No --detach: the CLI waits for Railway's build and exits non-zero if it
      # fails, so a green run means the new code is actually serving (D077).
      - name: Deploy to PROD
        run: railway up --service content-factory-saas --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

      # F11: the deploy command only proves the container started. /health also reports
      # whether the start-up migrations finished, so a deploy that is serving on a
      # half-built schema fails here instead of being found by an operator.
      # PROD_URL is a repository variable (Settings > Variables), e.g. https://<host>.
      - name: Verify the deploy (health and migrations)
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "${PROD_URL}" ]; then
            echo "::warning::PROD_URL repository variable is not set - post-deploy check skipped"
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 20 "${PROD_URL%/}/health" || true)"
            echo "attempt ${attempt}: ${body}"
            if [ -n "${body}" ]; then
              python3 - "${body}" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("migrations") == "error" or data.get("status") != "ok":
              print("::error::deploy is degraded:", data)
              sys.exit(2)
          if data.get("migrations") == "unavailable":
              print("::warning::no database configured - migrations not applied")
          sys.exit(0)
          PY
              rc=$?
              if [ "${rc}" -eq 2 ]; then exit 1; fi
              if [ "${rc}" -eq 0 ]; then exit 0; fi
            fi
            sleep 20
          done
          echo "::error::health check never answered"
          exit 1
