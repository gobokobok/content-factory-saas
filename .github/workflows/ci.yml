name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # F20 / D116: reports known vulnerabilities in the runtime requirements. Warn-only
      # for now (continue-on-error) so one transitive advisory cannot block a release;
      # tighten to blocking once the first report has been triaged.
      - name: Dependency audit (pip-audit, warn only)
        continue-on-error: true
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --progress-spinner off

      - name: Run tests
        run: python -m pytest tests/ -m "not integration" --tb=short -v
        env:
          ENVIRONMENT: dev
          ANTHROPIC_API_KEY: test-key
          R2_ACCOUNT_ID: test-account
          R2_ACCESS_KEY_ID: test-key-id
          R2_SECRET_ACCESS_KEY: test-secret
          R2_BUCKET_NAME: test-bucket
          PEXELS_API_KEY: test-key
          REPLICATE_API_TOKEN: test-token
          FREESOUND_API_KEY: test-key
