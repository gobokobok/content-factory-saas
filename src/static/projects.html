<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Content Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/app.css">
  <link rel="stylesheet" href="/ui/shell.css">
</head>
<body class="cf-body">
<div class="cf-shell" id="cf-shell">
  <aside class="cf-nav" id="cf-nav"></aside>
  <div class="cf-scrim" onclick="CFShell.closeNav()"></div>
  <div class="cf-main">
    <nav class="cf-crumbs" id="cf-crumbs" aria-label="Breadcrumb"></nav>
    <main class="cf-page">
      <div class="wrap">
        <div class="page-head">
          <div><h1>Projects</h1><div class="sub">A project is one channel or series: its ideas, its runs and its defaults.</div></div>
          <button class="btn btn-primary" id="new-project-btn" onclick="dlgNewProject()">+ New project</button>
        </div>
        <div id="error" class="note err" style="display:none;"></div>
        <div id="notice" class="note" style="display:none;"></div>
        <div id="project-list"><div class="muted">Loading…</div></div>
      </div>
    </main>
  </div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/ui/shell.js"></script>
<script src="/ui/app.js"></script>
<script>
CFShell.mount({ active: 'projects', crumbs: [['Projects']] });

// A bookmarked run link from before P12 (`/#run/<id>/<stage>`) still opens the run.
// Also on hashchange: pasting such a link while already on this page does not reload it.
function forwardRunBookmark() {
  if (location.hash.startsWith('#run/')) location.replace('/studio' + location.hash);
}
forwardRunBookmark();
window.addEventListener('hashchange', forwardRunBookmark);

const DEFAULT_PROJECT_ID = 'default';
let tenantDefaults = { language: 'en', format: '9:16' };

function showMsg(id, msg) {
  const el = $(id);
  el.textContent = msg; el.style.display = msg ? '' : 'none';
}

// ── One-time import of this browser's local run history ───────────────────
// Before P12 Studio kept its run list in localStorage.studio_runs, and a run
// started from a pasted script never got a server-side row. Register them in the
// default project so they are not lost. The local list itself is left in place.
async function importLocalRuns() {
  let local = [];
  try {
    if (localStorage.getItem('studio_runs_imported')) return;
    local = JSON.parse(localStorage.getItem('studio_runs') || '[]');
  } catch { return; }
  const runs = local
    .filter(r => r && typeof r.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(r.id))
    .map(r => ({ id: r.id, name: String(r.name || r.scriptPreview || '').slice(0, 200), ts: Number(r.ts) || null }));
  if (!runs.length) {
    try { localStorage.setItem('studio_runs_imported', '1'); } catch { /* private mode */ }
    return;
  }
  try {
    const r = await api(`/platform/projects/${DEFAULT_PROJECT_ID}/runs/import`, jsonOpts('POST', { runs }));
    if (!r.ok) return;  // leave the flag unset — the import is retried on the next visit
    const data = await r.json();
    localStorage.setItem('studio_runs_imported', '1');
    if (data.imported > 0) {
      showMsg('notice', `${data.imported} run${data.imported === 1 ? '' : 's'} from this browser's history moved into "Default project".`);
    }
  } catch { /* retried on the next visit */ }
}

// ── Project list ──────────────────────────────────────────────────────────
function renderProjects(projects) {
  const el = $('project-list');
  if (!projects.length) {
    el.innerHTML = `<div class="empty"><strong>No projects yet</strong>Create a project to start collecting ideas and producing videos.
      <div class="actions"><button class="btn btn-primary" onclick="dlgNewProject()">+ New project</button></div></div>`;
    return;
  }
  el.innerHTML = projects.map(p => {
    const lang = (p.config && p.config.language) || tenantDefaults.language;
    return `<a class="row" href="/project?id=${encodeURIComponent(p.project_id)}">
      <div class="row-main">
        <div class="row-name">${esc(p.name)}</div>
        <div class="row-meta"><span>${p.niche ? esc(p.niche) : 'No niche set'}</span></div>
      </div>
      <span class="chip">${esc(LANGS[lang] || lang)}</span>
      <span class="mono muted">${p.run_count} run${p.run_count === 1 ? '' : 's'}${p.last_activity ? ' · ' + esc(fmtDate(p.last_activity)) : ''}</span>
    </a>`;
  }).join('');
}

async function loadProjects() {
  try {
    const r = await api('/platform/projects');
    if (!r.ok) throw new Error(`Error ${r.status}`);
    renderProjects(await r.json());
    showMsg('error', '');
  } catch (e) {
    $('project-list').innerHTML = '';
    showMsg('error', `Could not load projects: ${e.message}`);
  }
}

// ── New project ───────────────────────────────────────────────────────────
function dlgNewProject() {
  const d = tenantDefaults;
  overlay(`<div class="modal">
    <h2>New project</h2><div class="sub">Everything else is inherited from Settings → Defaults and can be changed later in the project's Settings.</div>
    <div class="grid2" style="margin-top:18px;">
      <div class="field full"><label class="label" for="np-name">Name</label><input class="input" id="np-name" maxlength="120" placeholder="The Housing Equation"></div>
      <div class="field full"><label class="label" for="np-niche">Niche — passed to script generation for every run (optional)</label><input class="input" id="np-niche" maxlength="200" placeholder="american housing economics"></div>
      <div class="field"><label class="label" for="np-lang">Language</label><select class="select" id="np-lang">${opts(LANGS, d.language)}</select><div class="hint">Default: ${esc(LANGS[d.language] || d.language)}</div></div>
      <div class="field"><label class="label" for="np-format">Format</label><select class="select" id="np-format">${opts(FORMATS, d.format)}</select><div class="hint">Default: ${esc(d.format)}</div></div>
    </div>
    <div class="actions"><button class="btn btn-primary" id="np-submit" onclick="createProject()">Create project</button><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button></div>
  </div>`);
  $('np-name').focus();
}

async function createProject() {
  const name = $('np-name').value.trim();
  if (!name) { $('np-name').focus(); return toast('Give the project a name.'); }
  // Only a choice that differs from the tenant default is stored, so the rest keeps inheriting.
  const config = {};
  if ($('np-lang').value !== tenantDefaults.language) config.language = $('np-lang').value;
  if ($('np-format').value !== tenantDefaults.format) config.run_defaults = { aspect_ratio: $('np-format').value };
  const btn = $('np-submit');
  btn.disabled = true;
  try {
    const r = await api('/platform/projects', jsonOpts('POST', { name, niche: $('np-niche').value.trim(), config }));
    if (!r.ok) throw new Error(await errorDetail(r));
    const project = await r.json();
    window.location.href = `/project?id=${encodeURIComponent(project.project_id)}`;
  } catch (e) {
    closeOverlay();
    showMsg('error', `Could not create the project: ${e.message}`);
  }
}

(async function init() {
  tenantDefaults = await loadTenantDefaults();
  await importLocalRuns();
  await loadProjects();
})();
</script>
</body>
</html>
