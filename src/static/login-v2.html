<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Factory — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #FAFAFA;
      --surface:     #FFFFFF;
      --border:      #E7E7E9;
      --ink:         #121215;
      --ink-sub:     #55555C;
      --muted:       #8B8B92;
      --faint:       #B4B4BA;
      --accent:      #2E45EC;
      --accent-h:    #1F33C9;
      --accent-ring: rgba(46, 69, 236, 0.28);
      --red:         #D92D20;
      --font: 'Schibsted Grotesk', system-ui, sans-serif;
      --mono: 'Fragment Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; gap: 28px;
      -webkit-font-smoothing: antialiased;
    }

    .brand {
      display: flex; align-items: center; gap: 11px;
      animation: fadeUp 0.4s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--ink); position: relative;
    }
    .brand-mark::after {
      content: ""; position: absolute; width: 10px; height: 10px;
      border-radius: 50%; background: var(--accent); right: 6px; bottom: 6px;
    }
    .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    .brand-name span { color: var(--muted); font-weight: 500; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      width: 380px; max-width: calc(100vw - 32px);
      box-shadow: 0 2px 16px rgba(18, 18, 21, 0.05);
      animation: fadeUp 0.4s 0.06s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .card h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
    .card p  { font-size: 13px; color: var(--muted); margin-bottom: 26px; }

    label {
      display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--ink-sub); margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%; padding: 10px 14px; font-size: 14px; font-family: var(--font);
      border: 1px solid var(--border); border-radius: 6px; outline: none;
      background: var(--surface); color: var(--ink);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .error { font-size: 13px; color: var(--red); margin-top: 10px; min-height: 18px; }
    /* An empty message takes no room: it sat as a blank band under the Google button. */
    #urlError:empty { display: none; }

    button[type="submit"] {
      width: 100%; margin-top: 16px; padding: 11px;
      background: var(--accent); color: #fff;
      font-family: var(--font); font-size: 14px; font-weight: 600;
      border: none; border-radius: 6px; cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--accent-h); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

    .foot {
      font-family: var(--mono); font-size: 10px; color: var(--faint);
      letter-spacing: 0.08em;
      animation: fadeUp 0.4s 0.12s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    .google { display:block; text-align:center; text-decoration:none; padding:11px 16px; border-radius:8px;
      border:1px solid var(--border-strong, #B4B4BA); color:var(--text, #121215); font-weight:600; margin:0; }
    #googleBtn + #urlError:not(:empty) { margin-bottom: 4px; }
    .google:hover { background:var(--bg-soft, #F0F0F2); }
    .apply { display:block; text-align:center; font-size:13px; font-weight:500; color:var(--accent);
      text-decoration:none; margin-top:18px; text-wrap:balance; line-height:1.45; }
    .apply:hover { color:var(--accent-h); text-decoration:underline; }
    .apply:focus-visible { outline:2px solid var(--accent-ring); outline-offset:3px; border-radius:4px; }
    .hidden { display:none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div class="brand-name">Content Factory <span>Studio</span></div>
  </div>

  <div class="card">
    <h1>Sign in</h1>
    <a class="google hidden" id="googleBtn" href="/auth/google/start">Continue with Google</a>
    <div class="error" id="urlError"></div>
    <p id="pwHint" class="hidden">Or enter the operator password.</p>
    <form id="loginForm" class="hidden">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <div class="error" id="errorMsg"></div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
    <a class="apply hidden" id="applyLink" href="#">No access to the platform? Apply for the demo access</a>
  </div>

  <div class="foot">OPERATOR CONSOLE</div>

  <script>
    (function () {
      const messages = {
        not_invited: 'This Google account is not invited yet. Ask the owner to add it.',
        expired: 'That sign-in took too long or was already used. Please try again.',
        google_failed: 'Google sign-in did not work. Please try again.',
        cancelled: 'Sign-in was cancelled.',
        disabled: 'This account has been switched off.',
        google_off: 'Google sign-in is not set up on this server.',
      };
      const code = new URLSearchParams(location.search).get('error');
      if (code) document.getElementById('urlError').textContent = messages[code] || 'Sign-in failed. Please try again.';
      // The demo-access request: a mail to the owner with a template that asks for the Gmail account to sign in with.
      function demoRequestHref(to) {
        const subject = 'Demo access request — Content Factory Studio';
        const body = [
          'Hi,', '',
          'I would like to try Content Factory Studio.', '',
          'Gmail account I will sign in with (required — the Google account you want me to add):',
          '', '',
          'My name:', '',
          'What I would like to make (optional):', '',
          'Thank you!',
        ].join('\n');
        return 'mailto:' + encodeURIComponent(to).replace(/%40/g, '@') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }
      fetch('/auth/providers').then(r => r.json()).then(p => {
        if (p.demo_access_email) {
          const link = document.getElementById('applyLink');
          link.href = demoRequestHref(p.demo_access_email);
          link.classList.remove('hidden');
        }
        if (p.google) document.getElementById('googleBtn').classList.remove('hidden');
        if (p.password) { document.getElementById('pwHint').classList.remove('hidden'); document.getElementById('loginForm').classList.remove('hidden'); }
        else if (!p.google) document.getElementById('urlError').textContent = messages.google_off;
      }).catch(() => {});
    })();
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.textContent = '';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.textContent = 'Incorrect password. Please try again.';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        err.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
