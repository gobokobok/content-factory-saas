<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Factory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: monospace;
      padding: 2rem;
      max-width: 820px;
      margin: 0 auto;
    }
    h1 { font-size: 1.1rem; color: #fff; margin: 0; }
    h2 { font-size: 1rem; color: #fff; margin: 0; font-weight: normal; }

    /* ── Buttons ─────────────────────────────────────────────────── */
    button {
      background: #1a1a1a;
      border: 1px solid #555;
      color: #e5e5e5;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 0.4rem 1rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: #888; }
    button:disabled { color: #6b7280; border-color: #333; cursor: not-allowed; }
    .btn-sm {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-color: #444;
    }
    .btn-back {
      font-size: 0.85rem;
      padding: 0.3rem 0.7rem;
      border-color: #444;
    }

    /* ── Status dots ─────────────────────────────────────────────── */
    .dot { font-size: 0.9rem; flex-shrink: 0; }
    .dot-pending  { color: #6b7280; }
    .dot-running  { color: #f59e0b; }
    .dot-complete { color: #22c55e; }
    .dot-failed   { color: #ef4444; }
    .dot-green    { color: #22c55e; }
    .dot-red      { color: #ef4444; }
    .dot-amber    { color: #f59e0b; }

    /* ── View header ─────────────────────────────────────────────── */
    .view-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .view-header-right { margin-left: auto; }

    /* ── New run panel ───────────────────────────────────────────── */
    #new-run-panel {
      border: 1px solid #333;
      padding: 1rem 1rem 0.8rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    #new-run-panel.visible { display: block; }
    label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 0.3rem; }
    input[type="text"], textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e5e5e5;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 0.45rem 0.55rem;
    }
    textarea { resize: vertical; min-height: 100px; }
    .hint { font-size: 0.75rem; color: #6b7280; margin: 0.2rem 0 0.8rem; }
    .hint-invalid { color: #ef4444; }
    .form-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }

    /* ── Run list ────────────────────────────────────────────────── */
    .run-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.8rem;
      border: 1px solid #222;
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    .run-row:hover { border-color: #555; background: #141414; }
    .run-id   { flex: 1; font-size: 0.9rem; }
    .run-date { font-size: 0.8rem; color: #6b7280; }
    .empty-state { color: #6b7280; font-size: 0.85rem; padding: 1.5rem 0; }

    /* ── Step rows ───────────────────────────────────────────────── */
    .step-row { border: 1px solid #222; margin-bottom: 0.5rem; }
    .step-main {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.6rem 0.8rem;
    }
    .step-label { flex: 1; font-size: 0.9rem; }
    .step-actions { display: flex; align-items: center; gap: 0.4rem; }
    .step-spinner { font-size: 0.8rem; color: #f59e0b; }

    /* ── Step sub-panels (artifact + script) ─────────────────────── */
    .step-artifact, .step-script {
      border-top: 1px solid #1e1e1e;
      padding: 0.8rem;
      display: none;
    }
    .step-artifact.open, .step-script.open { display: block; }

    /* ── Voiceover section ───────────────────────────────────────── */
    .vo-section {
      border: 1px dashed #333;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .vo-label { font-size: 0.85rem; color: #9ca3af; }
    .vo-filename { font-size: 0.8rem; color: #6b7280; }
    .vo-status { font-size: 0.8rem; }

    /* ── Artifact content ────────────────────────────────────────── */
    .scene-cards { display: flex; flex-direction: column; gap: 0.5rem; }
    .scene-card {
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 0.55rem 0.75rem;
    }
    .scene-hdr  { font-size: 0.77rem; color: #6b7280; margin-bottom: 0.3rem; }
    .scene-vo   { font-size: 0.85rem; color: #e5e5e5; margin-bottom: 0.2rem; }
    .scene-meta { font-size: 0.75rem; color: #6b7280; }

    .artifact-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .artifact-table th {
      text-align: left;
      color: #6b7280;
      padding: 0.3rem 0.6rem;
      border-bottom: 1px solid #333;
    }
    .artifact-table td {
      padding: 0.3rem 0.6rem;
      border-bottom: 1px solid #1a1a1a;
    }
    .artifact-table td.trunc {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    pre.artifact-pre {
      margin: 0;
      font-size: 0.78rem;
      color: #9ca3af;
      white-space: pre;
      overflow-x: auto;
      max-height: 360px;
      overflow-y: auto;
    }
    video.artifact-video { max-width: 100%; display: block; }
    .artifact-dl { margin-top: 0.4rem; font-size: 0.8rem; color: #6b7280; }
    .artifact-dl a { color: #6b7280; }

    /* ── Script textarea inside step panel ───────────────────────── */
    .script-panel-inner textarea { min-height: 80px; margin-bottom: 0.5rem; }
    .script-panel-inner .form-actions { margin-top: 0.3rem; }

    /* ── Run Log section ─────────────────────────────────────────── */
    .run-log-section {
      border: 1px solid #222;
      margin-top: 1rem;
    }
    .run-log-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .run-log-header:hover { color: #e5e5e5; }
    .run-log-toggle { font-size: 0.7rem; }
    .run-log-body {
      border-top: 1px solid #1e1e1e;
      padding: 0.8rem;
      display: none;
    }
    .run-log-body.open { display: block; }
    pre.run-log-pre {
      margin: 0;
      font-size: 0.82rem;
      color: #9ca3af;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* ── Misc ────────────────────────────────────────────────────── */
    .muted      { color: #6b7280; font-size: 0.82rem; }
    .error-text { color: #ef4444; font-size: 0.82rem; }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  LIST VIEW                                                    -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div id="view-list">
    <div class="view-header">
      <h1>Content Factory</h1>
      <div class="view-header-right">
        <button onclick="toggleNewRunPanel()">+ New Run</button>
      </div>
    </div>

    <div id="new-run-panel">
      <form id="new-run-form" autocomplete="off" onsubmit="submitNewRun(event)">
        <label for="nr-slug">Slug</label>
        <input type="text" id="nr-slug" placeholder="housing-affordability-crisis" oninput="validateNewRunForm()">
        <p id="nr-slug-hint" class="hint">lowercase letters and hyphens only</p>

        <label for="nr-script">Voiceover Script</label>
        <textarea id="nr-script" placeholder="Paste your plain-text VO script here…" oninput="validateNewRunForm()"></textarea>
        <p id="nr-script-hint" class="hint">required</p>

        <div class="form-actions">
          <button type="submit" id="nr-submit" disabled>Create Run</button>
          <button type="button" class="btn-sm" onclick="toggleNewRunPanel()">Cancel</button>
        </div>
      </form>
    </div>

    <div id="run-list-content"><span class="muted">loading…</span></div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  DETAIL VIEW                                                  -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div id="view-detail" style="display:none">
    <div class="view-header">
      <button class="btn-back" onclick="showList()">← Runs</button>
      <h2 id="detail-run-id"></h2>
    </div>
    <div id="step-rows"></div>

    <div class="run-log-section" id="run-log-section" style="display:none">
      <div class="run-log-header" onclick="toggleRunLog()">
        <span id="run-log-toggle">▶</span>
        <span>Run Log</span>
      </div>
      <div class="run-log-body" id="run-log-body">
        <pre class="run-log-pre" id="run-log-pre"></pre>
      </div>
    </div>
  </div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let currentRunId = null;
    let currentSteps = {};
    let stepRunning  = {};

    // ─── Step configuration ───────────────────────────────────────────────────
    const STEPS = [
      { key: 'storyboard',        label: 'Storyboard',        artifactKey: 'storyboard',    postPath: id => `/runs/${id}/storyboard`,    needsScript: true  },
      { key: 'asset_manifest',    label: 'Asset Manifest',    artifactKey: 'manifest',      postPath: id => `/runs/${id}/manifest`,      needsScript: false },
      { key: 'asset_acquisition', label: 'Asset Acquisition', artifactKey: null,            postPath: id => `/runs/${id}/assets`,        needsScript: false },
      { key: 'ffmpeg_script',     label: 'FFmpeg Script',      artifactKey: 'ffmpeg_script', postPath: id => `/runs/${id}/ffmpeg-script`, needsScript: false },
      { key: 'render',            label: 'Render',            artifactKey: 'render',        postPath: id => `/runs/${id}/render`,        needsScript: false },
    ];

    // ─── Utilities ────────────────────────────────────────────────────────────
    function esc(v) {
      return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function dotHtml(status) {
      if (status === 'complete') return '<span class="dot dot-complete">●</span>';
      if (status === 'failed')   return '<span class="dot dot-failed">●</span>';
      if (status === 'running')  return '<span class="dot dot-running">◌</span>';
      return '<span class="dot dot-pending">○</span>';
    }

    function overallStatus(steps) {
      const vals = Object.values(steps);
      if (!vals.length) return 'in-progress';
      if (vals.every(s => s === 'complete')) return 'complete';
      if (vals.some(s => s === 'failed'))    return 'failed';
      return 'in-progress';
    }

    // ─── New Run Form ─────────────────────────────────────────────────────────
    const SLUG_RE = /^[a-z][a-z0-9-]*[a-z0-9]$|^[a-z]$/;

    function toggleNewRunPanel() {
      const panel = document.getElementById('new-run-panel');
      const opening = !panel.classList.contains('visible');
      panel.classList.toggle('visible');
      if (opening) document.getElementById('nr-slug').focus();
    }

    function validateNewRunForm() {
      const slug   = document.getElementById('nr-slug').value;
      const script = document.getElementById('nr-script').value.trim();
      const hint   = document.getElementById('nr-slug-hint');

      if (slug === '') {
        hint.textContent = 'lowercase letters and hyphens only';
        hint.className   = 'hint';
      } else if (SLUG_RE.test(slug)) {
        hint.textContent = 'looks good';
        hint.className   = 'hint';
      } else {
        hint.textContent = 'lowercase letters and hyphens only, no leading/trailing hyphens';
        hint.className   = 'hint hint-invalid';
      }

      const scriptHint = document.getElementById('nr-script-hint');
      scriptHint.textContent = script ? '' : 'required';

      document.getElementById('nr-submit').disabled = !(SLUG_RE.test(slug) && script.length > 0);
    }

    async function submitNewRun(e) {
      e.preventDefault();
      const slug   = document.getElementById('nr-slug').value;
      const script = document.getElementById('nr-script').value.trim();
      const btn    = document.getElementById('nr-submit');

      btn.disabled    = true;
      btn.textContent = 'Creating…';

      try {
        const res = await fetch('/runs', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ slug }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => null);
          alert(`Failed to create run: ${err?.detail || res.statusText}`);
          btn.disabled    = false;
          btn.textContent = 'Create Run';
          return;
        }
        const { run_id } = await res.json();

        // Reset form and hide panel
        document.getElementById('new-run-panel').classList.remove('visible');
        document.getElementById('nr-slug').value   = '';
        document.getElementById('nr-script').value = '';
        btn.disabled    = false;
        btn.textContent = 'Create Run';
        validateNewRunForm();

        // Navigate to detail then auto-trigger storyboard + manifest
        await showDetail(run_id);
        autoRunNewRun(script);

      } catch (err) {
        alert(`Network error: ${err.message}`);
        btn.disabled    = false;
        btn.textContent = 'Create Run';
      }
    }

    // ─── Navigation ───────────────────────────────────────────────────────────
    function showList() {
      document.getElementById('view-list').style.display   = '';
      document.getElementById('view-detail').style.display = 'none';
      currentRunId = null;
      loadRunList();
    }

    async function showDetail(runId) {
      document.getElementById('view-list').style.display   = 'none';
      document.getElementById('view-detail').style.display = '';
      currentRunId = runId;
      stepRunning  = {};
      // Reset run log panel for the new run
      document.getElementById('run-log-section').style.display = 'none';
      document.getElementById('run-log-body').classList.remove('open');
      document.getElementById('run-log-toggle').textContent = '▶';
      document.getElementById('run-log-pre').textContent = '';

      document.getElementById('detail-run-id').textContent = runId;

      try {
        const res  = await fetch('/runs');
        const data = await res.json();
        const run  = (data.runs || []).find(r => r.run_id === runId);
        currentSteps = run ? { ...run.steps } : {};
      } catch (_) {
        currentSteps = {};
      }

      renderAllRows();
      refreshRunLog();
    }

    // ─── Run List ─────────────────────────────────────────────────────────────
    async function loadRunList() {
      const container = document.getElementById('run-list-content');
      container.innerHTML = '<span class="muted">loading…</span>';
      try {
        const res  = await fetch('/runs');
        const data = await res.json();
        if (!res.ok) {
          container.innerHTML = '<span class="error-text">Failed to load runs</span>';
          return;
        }
        if (!data.runs.length) {
          container.innerHTML = '<div class="empty-state">No runs yet. Create one above.</div>';
          return;
        }
        container.innerHTML = data.runs.map(run => {
          const st  = overallStatus(run.steps);
          const cls = st === 'complete' ? 'dot-green' : st === 'failed' ? 'dot-red' : 'dot-amber';
          const dt  = (run.created_at || '').substring(0, 10);
          return `<div class="run-row" onclick="showDetail('${esc(run.run_id)}')">
            <span class="dot ${cls}">●</span>
            <span class="run-id">${esc(run.run_id)}</span>
            <span class="run-date">${esc(dt)}</span>
          </div>`;
        }).join('');
      } catch (err) {
        container.innerHTML = `<span class="error-text">Network error: ${esc(err.message)}</span>`;
      }
    }

    // ─── Run Detail — Rendering ───────────────────────────────────────────────
    function renderAllRows() {
      const container = document.getElementById('step-rows');
      let html = '';
      for (const step of STEPS) {
        const status  = currentSteps[step.key] || 'pending';
        const running = !!stepRunning[step.key];
        html += buildStepRowHtml(step, status, running);
        if (step.key === 'ffmpeg_script') html += buildVoSectionHtml();
      }
      container.innerHTML = html;
    }

    function buildStepRowHtml(step, status, running) {
      return `<div class="step-row" id="steprow-${step.key}">
        <div class="step-main">
          ${dotHtml(running ? 'running' : status)}
          <span class="step-label">${esc(step.label)}</span>
          <div class="step-actions" id="actions-${step.key}">${buildActionsHtml(step, status, running)}</div>
        </div>
        <div class="step-artifact" id="artifact-${step.key}"></div>
        <div class="step-script"   id="script-panel-${step.key}"></div>
      </div>`;
    }

    function buildActionsHtml(step, status, running) {
      if (running) return '<span class="step-spinner">running…</span>';
      if (status === 'complete') {
        const view = step.artifactKey
          ? `<button class="btn-sm" onclick="toggleArtifact('${step.key}')">View</button>`
          : '';
        return `${view}<button class="btn-sm" onclick="showScriptOrRun('${step.key}')">Rerun</button>`;
      }
      return `<button class="btn-sm" onclick="showScriptOrRun('${step.key}')">Run</button>`;
    }

    function buildVoSectionHtml() {
      return `<div class="vo-section">
        <span class="vo-label">Voiceover</span>
        <input type="file" id="vo-file-input" accept=".mp3,audio/*" style="display:none" onchange="onVoFileSelected()">
        <button class="btn-sm" onclick="document.getElementById('vo-file-input').click()">Choose File</button>
        <span id="vo-filename" class="vo-filename">no file selected</span>
        <button class="btn-sm" id="vo-upload-btn" disabled onclick="uploadVoiceover()">Upload</button>
        <span id="vo-upload-status" class="vo-status"></span>
      </div>`;
    }

    function updateStepRow(stepKey, status, running) {
      const row = document.getElementById(`steprow-${stepKey}`);
      if (!row) return;

      const dot = row.querySelector('.dot');
      const newDot = document.createElement('span');
      const resolved = running ? 'running' : status;
      const chars   = { pending: '○', running: '◌', complete: '●', failed: '●' };
      const classes = { pending: 'dot-pending', running: 'dot-running', complete: 'dot-complete', failed: 'dot-failed' };
      newDot.className   = `dot ${classes[resolved] || 'dot-pending'}`;
      newDot.textContent = chars[resolved] || '○';
      dot.replaceWith(newDot);

      const step = STEPS.find(s => s.key === stepKey);
      document.getElementById(`actions-${stepKey}`).innerHTML = buildActionsHtml(step, status, running);
    }

    // ─── Step Execution ───────────────────────────────────────────────────────
    function showScriptOrRun(stepKey) {
      const step  = STEPS.find(s => s.key === stepKey);
      const panel = document.getElementById(`script-panel-${stepKey}`);

      if (!step.needsScript) {
        executeStep(stepKey);
        return;
      }
      // Toggle script panel
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
        return;
      }
      panel.innerHTML = `<div class="script-panel-inner">
        <label>VO Script</label>
        <textarea id="script-input-${stepKey}" placeholder="Paste VO script…"></textarea>
        <div class="form-actions">
          <button onclick="executeStep('${stepKey}')">Run ${esc(step.label)}</button>
          <button class="btn-sm" onclick="hideScriptPanel('${stepKey}')">Cancel</button>
        </div>
      </div>`;
      panel.classList.add('open');
      document.getElementById(`script-input-${stepKey}`).focus();
    }

    function hideScriptPanel(stepKey) {
      const panel = document.getElementById(`script-panel-${stepKey}`);
      if (panel) panel.classList.remove('open');
    }

    async function executeStep(stepKey, scriptOverride) {
      const step = STEPS.find(s => s.key === stepKey);

      let body = null;
      if (step.needsScript) {
        let script = scriptOverride;
        if (!script) {
          const input = document.getElementById(`script-input-${stepKey}`);
          script = input ? input.value.trim() : '';
        }
        if (!script) { alert('VO script is required'); return; }
        body = JSON.stringify({ script });
        hideScriptPanel(stepKey);
      }

      stepRunning[stepKey] = true;
      updateStepRow(stepKey, currentSteps[stepKey] || 'pending', true);

      // Clear any previous error
      const artifactDiv = document.getElementById(`artifact-${stepKey}`);
      if (artifactDiv && !artifactDiv.classList.contains('open')) {
        artifactDiv.innerHTML = '';
      }

      try {
        const res = await fetch(step.postPath(currentRunId), {
          method:  'POST',
          ...(body ? { headers: { 'Content-Type': 'application/json' }, body } : {}),
        });
        if (res.ok) {
          currentSteps[stepKey] = 'complete';
        } else {
          currentSteps[stepKey] = 'failed';
          const err = await res.json().catch(() => null);
          showStepError(stepKey, `Error ${res.status}: ${err?.detail || res.statusText}`);
        }
      } catch (err) {
        currentSteps[stepKey] = 'failed';
        showStepError(stepKey, `Network error: ${err.message}`);
      } finally {
        stepRunning[stepKey] = false;
        updateStepRow(stepKey, currentSteps[stepKey], false);
        refreshRunLog();
      }
    }

    function showStepError(stepKey, msg) {
      const div = document.getElementById(`artifact-${stepKey}`);
      if (!div) return;
      div.innerHTML = `<span class="error-text">${esc(msg)}</span>`;
      div.classList.add('open');
    }

    async function autoRunNewRun(script) {
      await executeStep('storyboard', script);
      if (currentSteps['storyboard'] === 'complete') {
        await executeStep('asset_manifest');
      }
    }

    // ─── Artifact Viewer ──────────────────────────────────────────────────────
    async function toggleArtifact(stepKey) {
      const div  = document.getElementById(`artifact-${stepKey}`);
      const step = STEPS.find(s => s.key === stepKey);

      if (div.classList.contains('open')) {
        div.classList.remove('open');
        return;
      }
      div.innerHTML = '<span class="muted">loading…</span>';
      div.classList.add('open');

      try {
        const res  = await fetch(`/runs/${currentRunId}/artifact/${step.artifactKey}`);
        const data = await res.json();
        if (!res.ok) {
          div.innerHTML = `<span class="error-text">${esc(data.detail || 'Failed to load artifact')}</span>`;
          return;
        }
        div.innerHTML = renderArtifactHtml(stepKey, data);
      } catch (err) {
        div.innerHTML = `<span class="error-text">Network error: ${esc(err.message)}</span>`;
      }
    }

    function renderArtifactHtml(stepKey, data) {
      if (stepKey === 'storyboard')     return renderStoryboard(data.content);
      if (stepKey === 'asset_manifest') return renderManifest(data.content);
      if (stepKey === 'ffmpeg_script')  return `<pre class="artifact-pre">${esc(data.content)}</pre>`;
      if (stepKey === 'render') {
        return `<video class="artifact-video" src="${esc(data.url)}" controls></video>
          <div class="artifact-dl"><a href="${esc(data.url)}" target="_blank">↓ download final.mp4</a></div>`;
      }
      return '<span class="muted">no preview available</span>';
    }

    function renderStoryboard(content) {
      const scenes = content?.scenes;
      if (!scenes?.length) return '<span class="muted">no scenes found</span>';
      const cards = scenes.map(s => {
        const vp = s.visual_prompts || {};
        return `<div class="scene-card">
        <div class="scene-hdr">Scene ${esc(s.scene)} · ${esc(s.clip_type)} · ${esc(s.duration_s)}s</div>
        <div class="scene-vo">${esc(s.voiceover_line)}</div>
        <div class="scene-meta">motion: ${esc(s.motion_effect || '—')}  sfx: ${esc(s.sfx || '—')}</div>
        <div class="scene-meta">PRIMARY: ${esc(vp.primary_stk || '—')}</div>
        <div class="scene-meta">FALLBACK: ${esc(vp.fallback_stk || '—')}</div>
        <div class="scene-meta">AI: ${esc(vp.ai_generate || '—')}</div>
      </div>`;
      }).join('');
      return `<div class="scene-cards">${cards}</div>`;
    }

    function renderManifest(content) {
      const entries = content?.entries;
      if (!entries?.length) return '<span class="muted">no entries found</span>';
      const rows = entries.map(e => {
        const file = e.file_key ? e.file_key.split('/').pop() : '—';
        return `<tr>
          <td>${esc(e.scene_id)}</td>
          <td>${esc(e.clip_type)}</td>
          <td>${esc(e.source || '—')}</td>
          <td>${esc(e.status)}</td>
          <td class="trunc" title="${esc(e.file_key || '')}">${esc(file)}</td>
        </tr>`;
      }).join('');
      return `<table class="artifact-table">
        <thead><tr><th>Scene</th><th>Type</th><th>Source</th><th>Status</th><th>File</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // ─── Voiceover Upload ─────────────────────────────────────────────────────
    function onVoFileSelected() {
      const file = document.getElementById('vo-file-input')?.files?.[0];
      if (!file) return;
      document.getElementById('vo-filename').textContent = file.name;
      document.getElementById('vo-upload-btn').disabled  = false;
      document.getElementById('vo-upload-status').textContent  = '';
      document.getElementById('vo-upload-status').style.color  = '';
    }

    async function uploadVoiceover() {
      const file = document.getElementById('vo-file-input')?.files?.[0];
      if (!file) return;

      const btn      = document.getElementById('vo-upload-btn');
      const statusEl = document.getElementById('vo-upload-status');

      btn.disabled       = true;
      statusEl.textContent  = 'uploading…';
      statusEl.style.color  = '#6b7280';

      try {
        // Step 1: get presigned PUT URL
        const urlRes = await fetch(`/runs/${currentRunId}/voiceover-upload-url`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ filename: file.name }),
        });
        if (!urlRes.ok) {
          const err = await urlRes.json().catch(() => null);
          statusEl.textContent = `Error: ${err?.detail || urlRes.statusText}`;
          statusEl.style.color = '#ef4444';
          btn.disabled = false;
          return;
        }
        const { upload_url } = await urlRes.json();

        // Step 2: PUT file directly to R2
        const putRes = await fetch(upload_url, {
          method:  'PUT',
          headers: { 'Content-Type': file.type || 'audio/mpeg' },
          body:    file,
        });
        if (!putRes.ok) {
          statusEl.textContent = `Upload failed (${putRes.status})`;
          statusEl.style.color = '#ef4444';
          btn.disabled = false;
          return;
        }

        statusEl.textContent = `✓ ${file.name} uploaded`;
        statusEl.style.color = '#22c55e';

      } catch (err) {
        statusEl.textContent = `Network error: ${esc(err.message)}`;
        statusEl.style.color = '#ef4444';
        btn.disabled = false;
      }
    }

    // ─── Run Log ──────────────────────────────────────────────────────────────
    function toggleRunLog() {
      const body   = document.getElementById('run-log-body');
      const toggle = document.getElementById('run-log-toggle');
      const open   = body.classList.toggle('open');
      toggle.textContent = open ? '▼' : '▶';
    }

    async function refreshRunLog() {
      if (!currentRunId) return;
      try {
        const res  = await fetch(`/runs/${currentRunId}/run-log-txt`);
        const data = await res.json();
        if (!data.available || !data.content) return;
        const section = document.getElementById('run-log-section');
        section.style.display = '';
        document.getElementById('run-log-pre').textContent = data.content;
      } catch (_) {}
    }

    // ─── Init ─────────────────────────────────────────────────────────────────
    showList();
  </script>
</body>
</html>
