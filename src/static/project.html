<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Content Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    /* Project page: shortlist + runs + settings (P12-S2/S3/S4, D092, D094). Same
       "Monochrome Console" tokens as studio-v2.html — a separate static page. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --border: #E7E7E9; --border2: #F0F0F2;
      --ink: #121215; --ink-sub: #55555C; --muted: #8B8B92; --faint: #B4B4BA;
      --accent: #2E45EC; --accent-h: #1F33C9; --accent-tint: #EEF0FE; --accent-ring: rgba(46, 69, 236, 0.28);
      --red: #D92D20; --red-tint: #FEF1F0;
      --font: 'Schibsted Grotesk', system-ui, sans-serif; --mono: 'Fragment Mono', ui-monospace, monospace;
      --r: 8px; --r-sm: 6px;
    }
    body {
      font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--ink);
      background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font-family: var(--font); }
    :focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; border-radius: 4px; }

    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 14px 40px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); position: relative; flex-shrink: 0; }
    .brand-mark::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); right: 5px; bottom: 5px; }
    .brand-name { font-weight: 700; letter-spacing: -0.01em; }
    .brand-name span { color: var(--muted); font-weight: 500; }
    .spacer { flex: 1; }

    .page { max-width: 820px; padding: 40px 40px 120px; }
    .back { display: inline-block; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 14px; }
    .back:hover { color: var(--ink); }
    .page-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 28px; }
    .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

    .section-head { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 14px; flex-wrap: wrap; }
    .section-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .section-count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--r-sm);
      font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; line-height: 1; transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--faint); background: var(--border2); }
    .btn-ghost { background: transparent; color: var(--muted); font-weight: 500; }
    .btn-ghost:hover:not(:disabled) { color: var(--ink); background: var(--border2); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .form-row > div { flex: 1; min-width: 200px; }
    .label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .input, .select {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
      font-size: 13px; color: var(--ink); background: var(--surface); transition: border-color 0.12s, box-shadow 0.12s;
    }
    textarea.input { resize: vertical; min-height: 64px; line-height: 1.5; }
    .input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
    .input::placeholder { color: var(--faint); }
    .saved-msg { font-size: 12px; color: var(--muted); margin-left: 10px; font-family: var(--mono); }

    /* Shortlist items */
    .item {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; margin-bottom: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      transition: border-color 0.12s;
    }
    .item.selected { border-color: var(--accent); background: var(--accent-tint); }
    .item input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .item-main { flex: 1; min-width: 0; cursor: pointer; }
    .item-title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .item-summary { font-size: 13px; color: var(--ink-sub); margin-top: 2px; overflow-wrap: anywhere; }
    .item-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--ink-sub); background: var(--surface); text-transform: lowercase;
    }
    .badge-trend { border-color: var(--ink); color: var(--ink); }
    .badge-competitor { background: var(--ink); border-color: var(--ink); color: #fff; }
    .item-remove {
      background: none; border: none; cursor: pointer; color: var(--faint); font-size: 12px;
      padding: 4px 8px; border-radius: 4px; flex-shrink: 0;
    }
    .item-remove:hover { color: var(--red); background: var(--red-tint); }

    /* Run rows */
    .row {
      display: flex; align-items: center; gap: 16px; padding: 14px 18px; margin-bottom: 8px;
      text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .row:hover { border-color: var(--faint); box-shadow: 0 2px 8px rgba(18,18,21,0.05); }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .row-id { font-family: var(--mono); font-size: 10px; }
    .status { font-size: 11px; font-weight: 600; color: var(--ink-sub); flex-shrink: 0; }
    .status-failed { color: var(--red); }
    .row-arrow { color: var(--faint); flex-shrink: 0; }
    .row:hover .row-arrow { color: var(--ink); }

    .empty { text-align: center; padding: 32px 16px; border: 1px dashed var(--border); border-radius: var(--r); color: var(--muted); font-size: 13px; }
    .empty strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

    /* Selection bar — pinned to the bottom so "Create video" is reachable on a phone. */
    .select-bar {
      position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: center; gap: 12px;
      padding: 12px 40px; background: var(--surface); border-top: 1px solid var(--border);
      box-shadow: 0 -8px 24px rgba(18, 18, 21, 0.06); z-index: 50;
    }
    .select-bar.open { display: flex; }
    .select-bar-text { font-size: 13px; color: var(--ink-sub); flex: 1; min-width: 0; }

    .error-bar { padding: 10px 14px; border: 1px solid #F4C6C2; border-radius: var(--r-sm); background: var(--red-tint); color: var(--red); font-size: 13px; margin-bottom: 16px; }
    .muted { color: var(--muted); }

    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; }
      .page { padding: 24px 16px 120px; }
      .select-bar { padding: 12px 16px; }
      .item { padding: 12px; }
      .row { padding: 12px 14px; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" title="All projects">
    <div class="brand-mark" aria-hidden="true"></div>
    <div class="brand-name">CF <span>Studio</span></div>
  </a>
  <div class="spacer"></div>
  <a class="btn btn-ghost" href="/settings" style="text-decoration:none;">Settings</a>
  <button class="btn btn-ghost" onclick="logOut()">Log out</button>
</header>

<main class="page">
  <a class="back" href="/">← All projects</a>
  <div id="error" class="error-bar" style="display:none;"></div>

  <div class="page-head">
    <div style="flex:1;min-width:0;">
      <h1 class="page-title" id="project-name">…</h1>
      <div class="page-sub" id="project-niche"></div>
    </div>
    <button class="btn btn-secondary btn-sm" id="settings-btn" onclick="toggleSettings()">Settings</button>
  </div>

  <!-- Project settings -->
  <form class="card" id="settings-panel" style="display:none;" onsubmit="saveSettings(event)">
    <div class="card-title">Project settings</div>
    <div class="form-row">
      <div>
        <label class="label" for="set-name">Name</label>
        <input class="input" id="set-name" maxlength="120" required>
      </div>
      <div>
        <label class="label" for="set-niche">Niche — passed to script generation for every run</label>
        <input class="input" id="set-niche" maxlength="200" placeholder="american housing economics">
      </div>
    </div>
    <div class="card-title" style="margin-top:6px;">Defaults for new runs</div>
    <div class="form-row">
      <div>
        <label class="label" for="set-aspect">Aspect ratio</label>
        <select class="select" id="set-aspect">
          <option value="9:16">9:16 Portrait</option>
          <option value="16:9">16:9 Landscape</option>
        </select>
      </div>
      <div>
        <label class="label" for="set-captions">Captions</label>
        <select class="select" id="set-captions">
          <option value="standard">On — Standard</option>
          <option value="punch">On — Punch</option>
          <option value="none">Off</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label class="label" for="set-pace">Narration pace</label>
        <select class="select" id="set-pace">
          <option value="slow">Slow — ~145 wpm</option>
          <option value="normal">Normal — ~160 wpm</option>
          <option value="fast">Fast — ~172 wpm</option>
        </select>
      </div>
      <div>
        <label class="label" for="set-style">Narration style</label>
        <select class="select" id="set-style">
          <option value="educational">Educational</option>
          <option value="emotional">Emotional</option>
        </select>
      </div>
    </div>
    <div class="card-title" style="margin-top:6px;">AI images</div>
    <div class="form-row">
      <div style="min-width:100%;">
        <label class="label" for="set-ai-style">Look across scenes (optional) — added in front of every AI image prompt in this project</label>
        <textarea class="input" id="set-ai-style" rows="2" maxlength="600" placeholder="Muted editorial illustration, flat colours, soft grain, no text"></textarea>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" type="submit" id="set-save">Save</button>
    <span class="saved-msg" id="set-msg"></span>
  </form>

  <!-- Shortlist -->
  <div class="section-head">
    <h2 class="section-title">Shortlist</h2>
    <span class="section-count" id="shortlist-count"></span>
    <div class="spacer"></div>
    <button class="btn btn-secondary btn-sm" onclick="toggleAddIdea()">+ Add idea</button>
  </div>

  <form class="card" id="add-idea-form" style="display:none;" onsubmit="addIdea(event)">
    <label class="label" for="idea-title">Idea / title</label>
    <input class="input" id="idea-title" maxlength="300" placeholder="Why starter homes disappeared from America" required style="margin-bottom:14px;">
    <label class="label" for="idea-summary">Summary (optional)</label>
    <textarea class="input" id="idea-summary" maxlength="2000" placeholder="What the video is about, in a sentence or two" style="margin-bottom:14px;"></textarea>
    <div class="form-row">
      <div>
        <label class="label" for="idea-source">Source (optional)</label>
        <input class="input" id="idea-source" maxlength="200" placeholder="e.g. a report, a channel, a conversation">
      </div>
      <div>
        <label class="label" for="idea-notes">Notes (optional)</label>
        <input class="input" id="idea-notes" maxlength="2000" placeholder="Why this idea is worth making">
      </div>
    </div>
    <button class="btn btn-primary btn-sm" type="submit" id="idea-submit">Add to shortlist</button>
    <button class="btn btn-ghost btn-sm" type="button" onclick="toggleAddIdea()">Cancel</button>
  </form>

  <div id="shortlist"><div class="muted">Loading…</div></div>

  <!-- Runs -->
  <div class="section-head">
    <h2 class="section-title">Runs</h2>
    <span class="section-count" id="run-count"></span>
  </div>
  <div id="runs"><div class="muted">Loading…</div></div>
</main>

<div class="select-bar" id="select-bar">
  <div class="select-bar-text" id="select-bar-text"></div>
  <button class="btn btn-ghost btn-sm" onclick="clearSelection()">Clear</button>
  <button class="btn btn-primary" id="create-video-btn" onclick="createVideo()">Create video →</button>
</div>

<script>
const PROJECT_ID = new URLSearchParams(location.search).get('id');
if (!PROJECT_ID) location.replace('/');

const BASE = `/platform/projects/${encodeURIComponent(PROJECT_ID)}`;
const STATUS_LABELS = { created: 'Draft', running: 'In progress', complete: 'Done', failed: 'Failed' };

let project = null;
let items = [];
const selected = new Set();   // item ids ticked for "Create video", in tick order

function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showErr(msg) {
  const el = document.getElementById('error');
  el.textContent = msg; el.style.display = msg ? '' : 'none';
  if (msg) el.scrollIntoView({ block: 'nearest' });
}
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { window.location.href = '/login'; throw new Error('Unauthorized'); }
  return r;
}
async function errorDetail(r) {
  const err = await r.json().catch(() => ({}));
  return typeof err.detail === 'string' ? err.detail : `Error ${r.status}`;
}
async function logOut() {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

// ── Project header + settings ─────────────────────────────────────────────
function renderProject() {
  document.title = `${project.name} — Content Factory`;
  document.getElementById('project-name').textContent = project.name;
  document.getElementById('project-niche').textContent = project.niche || 'No niche set — add one in Settings';
  const d = (project.config && project.config.run_defaults) || {};
  document.getElementById('set-name').value = project.name;
  document.getElementById('set-niche').value = project.niche;
  document.getElementById('set-aspect').value = d.aspect_ratio || '9:16';
  document.getElementById('set-captions').value = d.subtitles === 'none' ? 'none' : (d.caption_style || 'standard');
  document.getElementById('set-pace').value = d.narration_pace || 'normal';
  document.getElementById('set-style').value = d.narration_style || 'educational';
  document.getElementById('set-ai-style').value = (project.config && project.config.ai_image_style) || '';
}

async function loadProject() {
  const r = await api(BASE);
  if (r.status === 404) { location.replace('/'); return false; }
  if (!r.ok) throw new Error(await errorDetail(r));
  project = await r.json();
  renderProject();
  return true;
}

function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  panel.style.display = panel.style.display === 'none' ? '' : 'none';
  document.getElementById('set-msg').textContent = '';
}

async function saveSettings(event) {
  event.preventDefault();
  const captions = document.getElementById('set-captions').value;
  // run_defaults uses the same keys as a run's settings.json (src.models.VideoSettings),
  // so Studio applies them to a new run without translation.
  const run_defaults = {
    aspect_ratio: document.getElementById('set-aspect').value,
    subtitles: captions === 'none' ? 'none' : 'TikTok',
    caption_style: captions === 'none' ? 'standard' : captions,
    narration_pace: document.getElementById('set-pace').value,
    narration_style: document.getElementById('set-style').value,
  };
  const btn = document.getElementById('set-save');
  btn.disabled = true;
  try {
    const r = await api(BASE, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('set-name').value.trim(),
        niche: document.getElementById('set-niche').value.trim(),
        config: { ...(project.config || {}), run_defaults, ai_image_style: document.getElementById('set-ai-style').value.trim() },
      }),
    });
    if (!r.ok) throw new Error(await errorDetail(r));
    project = await r.json();
    renderProject();
    document.getElementById('set-msg').textContent = '✓ saved';
    showErr('');
  } catch (e) {
    showErr(`Could not save settings: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

// ── Shortlist ─────────────────────────────────────────────────────────────
function renderShortlist() {
  document.getElementById('shortlist-count').textContent = items.length ? String(items.length) : '';
  const el = document.getElementById('shortlist');
  if (!items.length) {
    el.innerHTML = `<div class="empty"><strong>No ideas yet</strong>Add an idea by hand to start. Every video run is created from one or more shortlist ideas.</div>`;
  } else {
    el.innerHTML = items.map(item => {
      const isSel = selected.has(item.item_id);
      const id = esc(item.item_id);
      const runs = `${item.run_count} run${item.run_count === 1 ? '' : 's'}`;
      return `
        <div class="item${isSel ? ' selected' : ''}">
          <input type="checkbox" aria-label="Select idea" ${isSel ? 'checked' : ''} onchange="toggleItem('${id}')">
          <div class="item-main" onclick="toggleItem('${id}')">
            <div class="item-title">${esc(item.title)}</div>
            ${item.summary ? `<div class="item-summary">${esc(item.summary)}</div>` : ''}
            <div class="item-meta">
              <span class="badge badge-${esc(item.discovery_method)}">${esc(item.discovery_method)}</span>
              ${item.source ? `<span>${esc(item.source)}</span>` : ''}
              <span title="Date discovered">${esc(fmtDate(item.discovered_at))}</span>
              <span>${runs}</span>
            </div>
          </div>
          <button class="item-remove" title="Remove from shortlist" onclick="removeItem('${id}')">Remove</button>
        </div>`;
    }).join('');
  }
  renderSelectBar();
}

function renderSelectBar() {
  const bar = document.getElementById('select-bar');
  const n = selected.size;
  bar.classList.toggle('open', n > 0);
  document.getElementById('select-bar-text').textContent =
    n === 1 ? '1 idea selected' : `${n} ideas selected — combined into one video`;
}

function toggleItem(itemId) {
  if (selected.has(itemId)) selected.delete(itemId); else selected.add(itemId);
  renderShortlist();
}
function clearSelection() { selected.clear(); renderShortlist(); }

async function loadShortlist() {
  const r = await api(`${BASE}/shortlist`);
  if (!r.ok) throw new Error(await errorDetail(r));
  items = await r.json();
  const live = new Set(items.map(i => i.item_id));
  [...selected].forEach(id => { if (!live.has(id)) selected.delete(id); });
  renderShortlist();
}

function toggleAddIdea() {
  const form = document.getElementById('add-idea-form');
  const open = form.style.display === 'none';
  form.style.display = open ? '' : 'none';
  if (open) document.getElementById('idea-title').focus();
}

async function addIdea(event) {
  event.preventDefault();
  const title = document.getElementById('idea-title').value.trim();
  if (!title) return;
  const btn = document.getElementById('idea-submit');
  btn.disabled = true;
  try {
    const r = await api(`${BASE}/shortlist`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        summary: document.getElementById('idea-summary').value.trim(),
        source: document.getElementById('idea-source').value.trim() || null,
        notes: document.getElementById('idea-notes').value.trim() || null,
      }),
    });
    if (!r.ok) throw new Error(await errorDetail(r));
    document.getElementById('add-idea-form').reset();
    document.getElementById('add-idea-form').style.display = 'none';
    showErr('');
    await loadShortlist();
  } catch (e) {
    showErr(`Could not add the idea: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

async function removeItem(itemId) {
  const item = items.find(i => i.item_id === itemId);
  if (!item) return;
  const runNote = item.run_count ? ` Runs already created from it are kept.` : '';
  if (!confirm(`Remove "${item.title}" from the shortlist?${runNote}`)) return;
  try {
    const r = await api(`${BASE}/shortlist/${encodeURIComponent(itemId)}`, { method: 'DELETE' });
    if (!r.ok && r.status !== 404) throw new Error(await errorDetail(r));
    selected.delete(itemId);
    showErr('');
    await loadShortlist();
  } catch (e) {
    showErr(`Could not remove the idea: ${e.message}`);
  }
}

// ── Runs ──────────────────────────────────────────────────────────────────
function renderRuns(runs) {
  document.getElementById('run-count').textContent = runs.length ? String(runs.length) : '';
  const el = document.getElementById('runs');
  if (!runs.length) {
    el.innerHTML = `<div class="empty"><strong>No runs yet</strong>Tick one or more shortlist ideas and press "Create video".</div>`;
    return;
  }
  el.innerHTML = runs.map(run => {
    const label = run.name || 'Untitled run';
    return `
      <a class="row" href="/studio#run/${encodeURIComponent(run.run_id)}/settings">
        <div class="row-main">
          <div class="row-name">${esc(label)}</div>
          <div class="row-meta">
            <span class="row-id">${esc(run.run_id.split('-')[0])}</span>
            <span>${esc(fmtDate(run.created_at))}</span>
          </div>
        </div>
        <span class="status status-${esc(run.status)}">${esc(STATUS_LABELS[run.status] || run.status)}</span>
        <svg class="row-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </a>`;
  }).join('');
}

async function loadRuns() {
  const r = await api(`${BASE}/runs`);
  if (!r.ok) throw new Error(await errorDetail(r));
  renderRuns(await r.json());
}

// ── Create a run from the ticked ideas (P12-S4) ───────────────────────────
async function createVideo() {
  if (!selected.size) return;
  const btn = document.getElementById('create-video-btn');
  btn.disabled = true;
  try {
    const r = await api(`${BASE}/runs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_ids: [...selected] }),
    });
    if (!r.ok) throw new Error(await errorDetail(r));
    const run = await r.json();
    // Tells Studio this run is brand new, so it seeds Settings from the project
    // defaults instead of loading stored settings that do not exist yet.
    try { sessionStorage.setItem('cf_new_run', run.run_id); } catch { /* private mode */ }
    window.location.href = `/studio#run/${encodeURIComponent(run.run_id)}/settings`;
  } catch (e) {
    showErr(`Could not create the run: ${e.message}`);
    btn.disabled = false;
    loadShortlist().catch(() => {});
  }
}

(async function init() {
  if (!PROJECT_ID) return;
  try {
    if (!(await loadProject())) return;
    await Promise.all([loadShortlist(), loadRuns()]);
  } catch (e) {
    showErr(`Could not load the project: ${e.message}`);
  }
})();
</script>
</body>
</html>
