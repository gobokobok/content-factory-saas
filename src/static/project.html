<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Content Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/app.css">
  <link rel="stylesheet" href="/ui/shell.css">
</head>
<body class="cf-body">
<div class="cf-shell" id="cf-shell">
  <aside class="cf-nav" id="cf-nav"></aside>
  <div class="cf-scrim" onclick="CFShell.closeNav()"></div>
  <div class="cf-main">
    <nav class="cf-crumbs" id="cf-crumbs" aria-label="Breadcrumb"></nav>
    <main class="cf-page">
      <div id="error" class="note err" style="display:none;"></div>
      <div class="wrap" id="view"><div class="muted">Loading…</div></div>
    </main>
  </div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/ui/shell.js"></script>
<script src="/ui/app.js"></script>
<script>
/* Project pages — Overview, Ideas, Runs, Settings (P-UX build; shortlist P12, D092, D094).
   One file, four views chosen by ?tab=. The panel's links are plain URLs, so each view is bookmarkable. */
const params = new URLSearchParams(location.search);
const PROJECT_ID = params.get('id');
if (!PROJECT_ID) location.replace('/');
const TAB = ['overview', 'ideas', 'runs', 'settings'].includes(params.get('tab')) ? params.get('tab') : 'overview';
const BASE = `/platform/projects/${encodeURIComponent(PROJECT_ID)}`;
const STEP_LABELS = { script: 'Script', voice: 'Voice', storyboard: 'Storyboard', render: 'Video', metadata: 'Metadata' };
const TAB_LABELS = { overview: null, ideas: 'Ideas', runs: 'Runs', settings: 'Settings' };

let project = null, items = [], runs = [], tenant = { language: 'en', format: '9:16', captions: 'standard' };
const selected = new Set();   // idea ids ticked, in tick order
let runFilter = '';

// ── Run labels ─────────────────────────────────────────────────────────────
const isDone = r => r.steps_done >= 5;
function runStatus(r) {
  if (isDone(r)) return '<span class="chip ok">Done</span>';
  const at = STEP_LABELS[r.current_step] || 'Script';
  if (r.status === 'failed') return `<span class="chip bad">Needs attention · ${at}</span>`;
  return `<span class="chip run">At ${at}</span>`;
}
function voiceLabel(r) {
  if (!r.steps_done) return 'Script not started';
  return r.voice_source === 'uploaded' ? 'Uploaded voice' : 'Generated voice';
}
function runRow(r) {
  const stage = isDone(r) ? 'metadata' : (r.current_step || 'script');
  return `<a class="row" href="/studio#run/${encodeURIComponent(r.run_id)}/${stage}">
    <div class="row-main"><div class="row-name">${esc(r.name || 'Untitled run')}</div>
      <div class="row-meta"><span>${voiceLabel(r)}</span><span>${esc(LANGS[r.language] || r.language)}</span>${r.format ? `<span>${esc(r.format)}</span>` : ''}</div></div>
    ${runStatus(r)}</a>`;
}

// ── Overview ───────────────────────────────────────────────────────────────
function viewOverview() {
  const open = runs.filter(r => !isDone(r));
  const stat = (n, label, href) => `<a class="stat" href="${href}"><b>${n}</b><span>${label}</span></a>`;
  const empty = !runs.length && !items.length;
  return `<div class="page-head"><div><h1>${esc(project.name)}</h1><div class="sub">${esc(project.niche || 'No niche set — add one in Settings')}</div></div>
      <button class="btn btn-primary" onclick="dlgNewRun([])">+ New run</button></div>
    <div class="stats">
      ${stat(items.length, 'Ideas', tabUrl('ideas'))}${stat(runs.length, 'Runs', tabUrl('runs'))}
      ${stat(open.length, 'In progress', tabUrl('runs'))}${stat(runs.length - open.length, 'Done', tabUrl('runs'))}
    </div>
    ${empty ? `<div class="empty" style="margin-top:24px;"><strong>Start this project</strong>Add an idea to work from, or start a run and enter the details there.
        <div class="actions"><button class="btn btn-secondary" onclick="location.href='${tabUrl('ideas')}&add=1'">+ Add idea</button><button class="btn btn-primary" onclick="dlgNewRun([])">+ New run</button></div></div>` : `
    <div class="sec-head"><h2>Continue</h2><span class="count">${open.length || ''}</span><a class="more" href="${tabUrl('runs')}">All runs →</a></div>
    ${open.length ? open.slice(0, 5).map(runRow).join('') : '<div class="empty">Nothing in progress.</div>'}
    <div class="sec-head"><h2>Newest ideas</h2><span class="count">${items.length || ''}</span><a class="more" href="${tabUrl('ideas')}">All ideas →</a></div>
    ${items.length ? items.slice(0, 3).map(i => ideaRow(i, false)).join('') : '<div class="empty">No ideas yet.</div>'}`}`;
}
const tabUrl = tab => `/project?id=${encodeURIComponent(PROJECT_ID)}${tab === 'overview' ? '' : '&tab=' + tab}`;

// ── Ideas ──────────────────────────────────────────────────────────────────
function ideaRow(i, selectable) {
  const sel = selected.has(i.item_id), id = esc(i.item_id);
  const meta = [i.discovery_method !== 'manual' ? `<span class="chip ink">${esc(i.discovery_method)}</span>` : '',
    i.source ? `<span>${esc(i.source)}</span>` : '', i.run_count ? `<span>${i.run_count} run${i.run_count === 1 ? '' : 's'}</span>` : ''].join('');
  return `<div class="row${sel && selectable ? ' sel' : ''}">
    ${selectable ? `<input type="checkbox" aria-label="Select idea" ${sel ? 'checked' : ''} onchange="toggleIdea('${id}')">` : ''}
    <div class="row-main">
      <div class="row-name">${esc(i.title)}</div>
      ${i.summary ? `<div style="font-size:13px;color:var(--ink-sub);margin-top:2px;">${esc(i.summary)}</div>` : ''}
      ${meta ? `<div class="row-meta">${meta}</div>` : ''}
    </div>
    ${selectable ? `<button class="btn btn-ghost btn-sm" onclick="dlgIdea('${id}')">Edit</button>` : ''}
    <button class="btn btn-secondary btn-sm" onclick="dlgNewRun(['${id}'])">Start run →</button>
  </div>`;
}
function viewIdeas() {
  const live = [...selected].filter(id => items.some(i => i.item_id === id));
  return `<div class="page-head"><div><h1>Ideas</h1><div class="sub">The shortlist. Start a run from one idea, or tick several to combine them into one video.</div></div>
      <button class="btn btn-secondary" onclick="dlgIdea()">+ Add idea</button></div>
    ${items.length ? items.map(i => ideaRow(i, true)).join('')
      : `<div class="empty"><strong>No ideas yet</strong>Add one by hand. You can also start a run without an idea.<div class="actions"><button class="btn btn-primary" onclick="dlgNewRun([])">New run without an idea</button></div></div>`}
    ${live.length > 1 ? `<div class="selbar"><span>${live.length} ideas selected — combined into one video</span>
      <button class="btn btn-ghost btn-sm" style="color:#fff;" onclick="selected.clear();render()">Clear</button>
      <button class="btn btn-primary btn-sm" onclick='dlgNewRun(${JSON.stringify(live)})'>Start run →</button></div>` : ''}`;
}
function toggleIdea(id) { selected.has(id) ? selected.delete(id) : selected.add(id); render(); }

function dlgIdea(id) {
  const i = id ? items.find(x => x.item_id === id) : null;
  overlay(`<div class="modal"><h2>${i ? 'Edit idea' : 'Add idea'}</h2>
    <div class="grid2" style="margin-top:16px;">
      <div class="field full"><label class="label" for="id-title">Idea / title</label><input class="input" id="id-title" maxlength="300" value="${esc(i ? i.title : '')}" placeholder="Why starter homes disappeared from America"></div>
      <div class="field full"><label class="label" for="id-sum">Summary (optional)</label><textarea class="input" id="id-sum" maxlength="2000" placeholder="What the video is about, in a sentence or two">${esc(i ? i.summary : '')}</textarea></div>
      <div class="field"><label class="label" for="id-src">Source (optional)</label><input class="input" id="id-src" maxlength="200" value="${esc(i ? i.source || '' : '')}" placeholder="A report, a channel, a conversation"></div>
      <div class="field"><label class="label" for="id-notes">Notes (optional)</label><input class="input" id="id-notes" maxlength="2000" value="${esc(i && i.evidence ? i.evidence.notes || '' : '')}" placeholder="Why this idea is worth making"></div>
    </div>
    <div class="actions"><button class="btn btn-primary" id="id-save" onclick="saveIdea('${id || ''}')">${i ? 'Save' : 'Add to ideas'}</button>
      <button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button>
      ${i ? `<button class="btn btn-danger btn-sm" style="margin-left:auto;" onclick="removeIdea('${esc(id)}')">Remove</button>` : ''}</div></div>`);
  $('id-title').focus();
}
async function saveIdea(id) {
  const title = $('id-title').value.trim();
  if (!title) { $('id-title').focus(); return toast('An idea needs a title.'); }
  const body = { title, summary: $('id-sum').value.trim(), source: $('id-src').value.trim(), notes: $('id-notes').value.trim() };
  $('id-save').disabled = true;
  try {
    const r = id ? await api(`${BASE}/shortlist/${encodeURIComponent(id)}`, jsonOpts('PATCH', body))
                 : await api(`${BASE}/shortlist`, jsonOpts('POST', { ...body, source: body.source || null, notes: body.notes || null }));
    if (!r.ok) throw new Error(await errorDetail(r));
    closeOverlay(); showErr(''); await loadItems(); render();
  } catch (e) { closeOverlay(); showErr(`Could not save the idea: ${e.message}`); }
}
async function removeIdea(id) {
  const item = items.find(i => i.item_id === id);
  if (!item) return;
  const note = item.run_count ? ' Runs already created from it are kept.' : '';
  if (!confirm(`Remove "${item.title}" from the shortlist?${note}`)) return;
  try {
    const r = await api(`${BASE}/shortlist/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (!r.ok && r.status !== 404) throw new Error(await errorDetail(r));
    selected.delete(id); closeOverlay(); showErr(''); await loadItems(); render();
  } catch (e) { showErr(`Could not remove the idea: ${e.message}`); }
}

// ── Runs ───────────────────────────────────────────────────────────────────
function viewRuns() {
  const list = runs.filter(r => !runFilter || (runFilter === 'done' ? isDone(r) : runFilter === 'failed' ? r.status === 'failed' : !isDone(r) && r.status !== 'failed'));
  return `<div class="page-head"><div><h1>Runs</h1><div class="sub">One run is one video, from script or voiceover to the finished file.</div></div>
      <button class="btn btn-primary" onclick="dlgNewRun([])">+ New run</button></div>
    <div class="toolbar"><select class="select" onchange="runFilter=this.value;render()" aria-label="Filter runs">
      <option value="">All runs (${runs.length})</option>${opts({ progress: 'In progress', failed: 'Needs attention', done: 'Done' }, runFilter)}</select></div>
    ${list.length ? list.map(runRow).join('') : `<div class="empty"><strong>No runs${runs.length ? ' match this filter' : ' yet'}</strong>Start one from an idea, or on its own.
      <div class="actions"><button class="btn btn-primary" onclick="dlgNewRun([])">+ New run</button></div></div>`}`;
}

// ── New run ────────────────────────────────────────────────────────────────
/** The value a field starts with: the project's override, else the tenant default. */
const effective = key => projectOverrides(project)[key] ?? tenant[key];

function dlgNewRun(itemIds) {
  const picked = itemIds.map(id => items.find(i => i.item_id === id)).filter(Boolean);
  const title = picked.length ? picked.map(i => i.title).join(' + ') : '';
  const brief = picked.length > 1 ? picked.map(i => i.summary).filter(Boolean).join(' ') : '';
  window._newRunIds = picked.map(i => i.item_id);
  overlay(`<div class="modal">
    <h2>New run</h2><div class="sub">${picked.length ? `From ${picked.length === 1 ? 'the idea' : picked.length + ' ideas'} — edit anything.` : 'No idea attached. Enter the details here.'} In ${esc(project.name)}.</div>
    <div class="grid2" style="margin-top:16px;">
      <div class="field full"><label class="label" for="nr-title">Title</label><input class="input" id="nr-title" maxlength="300" value="${esc(title)}" placeholder="What is this video about?"></div>
      <div class="field full"><label class="label" for="nr-brief">Brief (optional) — what the script should cover</label><textarea class="input" id="nr-brief" maxlength="2000" placeholder="Angle, key numbers, what to leave out">${esc(brief)}</textarea></div>
      <div class="field"><label class="label" for="nr-lang">Language</label><select class="select" id="nr-lang">${opts(LANGS, effective('language'))}</select><div class="hint">Default: ${esc(LANGS[effective('language')] || effective('language'))}</div></div>
      <div class="field"><label class="label" for="nr-format">Format</label><select class="select" id="nr-format">${opts(FORMATS, effective('format'))}</select><div class="hint">Default: ${esc(effective('format'))}. Decides which footage is acquired.</div></div>
    </div>
    <div class="hint" style="margin-top:14px;">You choose where the script comes from — generate it, paste it or take it from a voiceover — in the run's first step.</div>
    <div class="actions"><button class="btn btn-primary" id="nr-create" onclick="createRun()">Create run →</button><button class="btn btn-ghost" onclick="closeOverlay()">Cancel</button></div>
  </div>`);
  $(title ? 'nr-create' : 'nr-title').focus();
}
async function createRun() {
  const title = $('nr-title').value.trim();
  if (!title && !window._newRunIds.length) { $('nr-title').focus(); return toast('Give the run a title.'); }
  const body = { item_ids: window._newRunIds, title: title || null, brief: $('nr-brief').value.trim() || null,
    language: $('nr-lang').value, aspect_ratio: $('nr-format').value };
  const btn = $('nr-create');
  btn.disabled = true;
  try {
    const r = await api(`${BASE}/runs`, jsonOpts('POST', body));
    if (!r.ok) throw new Error(await errorDetail(r));
    const run = await r.json();
    // Tells Studio this run is brand new, so it seeds its settings from the defaults
    // instead of loading stored settings that do not exist yet.
    try { sessionStorage.setItem('cf_new_run', run.run_id); } catch { /* private mode */ }
    window.location.href = `/studio#run/${encodeURIComponent(run.run_id)}/script`;
  } catch (e) { closeOverlay(); showErr(`Could not create the run: ${e.message}`); }
}

// ── Settings ───────────────────────────────────────────────────────────────
/** Save the project's config (and name / niche) and re-render. */
async function patchProject(fields, message) {
  try {
    const r = await api(BASE, jsonOpts('PATCH', fields));
    if (!r.ok) throw new Error(await errorDetail(r));
    project = await r.json(); showErr(''); CFShell.update({ project: { id: PROJECT_ID, name: project.name }, crumbs: crumbs() });
    render(); toast(message || 'Saved.');
  } catch (e) { showErr(`Could not save: ${e.message}`); }
}
/** Set (value given) or reset (value undefined) one run default. */
function setDefault(key, value) {
  const config = JSON.parse(JSON.stringify(project.config || {}));
  const rd = config.run_defaults = config.run_defaults || {};
  const reset = value === undefined || value === '';
  if (key === 'language') { reset ? delete config.language : config.language = value; }
  else if (key === 'format') { reset ? delete rd.aspect_ratio : rd.aspect_ratio = value; }
  else if (key === 'captions') {
    if (reset) { delete rd.subtitles; delete rd.caption_style; }
    else if (value === 'none') { rd.subtitles = 'none'; delete rd.caption_style; }
    else { rd.subtitles = 'TikTok'; rd.caption_style = value; }
  }
  else if (key === 'pace') { reset ? delete rd.narration_pace : rd.narration_pace = value; }
  else if (key === 'style') { reset ? delete rd.narration_style : rd.narration_style = value; }
  if (!Object.keys(rd).length) delete config.run_defaults;
  patchProject({ config }, 'Saved. New runs use this; existing runs keep their own settings.');
}
function inheritField(key, label, map) {
  const over = projectOverrides(project)[key] !== undefined;
  return `<div class="field"><label class="label">${label}</label>
    <select class="select" onchange="setDefault('${key}', this.value)">${opts(map, effective(key))}</select>
    <div class="hint${over ? ' over' : ''}">${over
      ? `Overridden for this project · <a href="javascript:void 0" onclick="setDefault('${key}')">Reset to Defaults (${esc(map[tenant[key]] || tenant[key])})</a>`
      : `Inherited from Settings → Defaults: ${esc(map[tenant[key]] || tenant[key])}`}</div></div>`;
}
function viewSettings() {
  const rd = (project.config && project.config.run_defaults) || {};
  return `<div class="narrow-wrap"><div class="page-head"><div><h1>Project settings</h1><div class="sub">Defaults for new runs in this project. A run copies them when it is created and can change them for itself.</div></div></div>
    <div class="card"><div class="card-title">Project</div><div class="card-sub">Used by every run.</div>
      <div class="grid2">
        <div class="field"><label class="label">Name</label><input class="input" maxlength="120" value="${esc(project.name)}" onchange="if(this.value.trim())patchProject({name:this.value.trim()});else this.value='${esc(project.name)}'"></div>
        <div class="field"><label class="label">Niche — passed to script generation for every run</label><input class="input" maxlength="200" value="${esc(project.niche)}" placeholder="american housing economics" onchange="patchProject({niche:this.value.trim()})"></div>
      </div></div>
    <div class="card"><div class="card-title">Defaults for new runs</div><div class="card-sub">Each shows where its value comes from.</div>
      <div class="grid2">
        ${inheritField('language', 'Language', LANGS)}${inheritField('format', 'Format', FORMATS)}${inheritField('captions', 'Captions', CAPTIONS)}
        <div class="field"><label class="label">Narration pace (generated voice)</label>
          <select class="select" onchange="setDefault('pace', this.value)"><option value="">Normal (built-in)</option>${opts(PACES, rd.narration_pace)}</select></div>
        <div class="field"><label class="label">Narration style (generated voice)</label>
          <select class="select" onchange="setDefault('style', this.value)"><option value="">Educational (built-in)</option>${opts(STYLES, rd.narration_style)}</select></div>
      </div></div>
    <div class="card"><div class="card-title">AI images</div><div class="card-sub">The provider and its key come from <a href="/settings?tab=integrations">Settings → Integrations</a>.</div>
      <label class="label">Look across scenes — added in front of every AI image prompt in this project</label>
      <textarea class="input" maxlength="600" placeholder="Muted editorial illustration, flat colours, soft grain, no text"
        onchange="patchProject({config:{...(project.config||{}),ai_image_style:this.value.trim()}})">${esc((project.config && project.config.ai_image_style) || '')}</textarea></div></div>`;
}

// ── Render and load ────────────────────────────────────────────────────────
function crumbs() {
  const c = [['Projects', '/'], [project ? project.name : '…', TAB === 'overview' ? null : tabUrl('overview')]];
  if (TAB !== 'overview') c.push([TAB_LABELS[TAB]]);
  return c;
}
function render() {
  document.title = `${project.name} — Content Factory`;
  $('view').className = 'wrap' + (TAB === 'settings' ? ' narrow' : '');
  $('view').innerHTML = { overview: viewOverview, ideas: viewIdeas, runs: viewRuns, settings: viewSettings }[TAB]();
}
async function loadItems() {
  const r = await api(`${BASE}/shortlist`);
  if (!r.ok) throw new Error(await errorDetail(r));
  items = await r.json();
}
async function loadRuns() {
  const r = await api(`${BASE}/runs`);
  if (!r.ok) throw new Error(await errorDetail(r));
  runs = await r.json();
}

(async function init() {
  if (!PROJECT_ID) return;
  CFShell.mount({ active: 'project', projectTab: TAB, crumbs: [['Projects', '/'], ['…']] });
  try {
    const r = await api(BASE);
    if (r.status === 404) { location.replace('/'); return; }
    if (!r.ok) throw new Error(await errorDetail(r));
    project = await r.json();
    CFShell.update({ project: { id: PROJECT_ID, name: project.name }, crumbs: crumbs() });
    [tenant] = await Promise.all([loadTenantDefaults(), loadItems(), loadRuns()]);
    render();
    if (params.get('add') === '1' && TAB === 'ideas') dlgIdea();
  } catch (e) {
    showErr(`Could not load the project: ${e.message}`);
    $('view').innerHTML = '';
  }
})();
</script>
</body>
</html>
