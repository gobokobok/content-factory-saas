<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Content Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/app.css">
  <link rel="stylesheet" href="/ui/shell.css">
</head>
<body class="cf-body">
<div class="cf-shell" id="cf-shell">
  <aside class="cf-nav" id="cf-nav"></aside>
  <div class="cf-main">
    <nav class="cf-crumbs" id="cf-crumbs" aria-label="Breadcrumb"></nav>
    <main class="cf-page">
      <div id="error" class="note err" style="display:none;"></div>
      <div class="wrap" id="view"><div class="muted">Loading…</div></div>
    </main>
  </div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/ui/shell.js"></script>
<script src="/ui/app.js"></script>
<script>
/* Tenant settings — Integrations (every service's key, plus the AI image provider) and
   Defaults (what every project inherits). Keys are never shown, only a four-character hint. */
const TAB = new URLSearchParams(location.search).get('tab') === 'defaults' ? 'defaults' : 'integrations';
let blocks = null, image = null, defaults = null, projects = [], keyEdit = '';

// ── Integrations ───────────────────────────────────────────────────────────
// Five blocks; each holds providers with their own key, and one default (per role in Audio).
const WIRED = { full: '', partial: 'Partly wired', planned: 'Planned' };
function keyState(p) {
  if (p.key_source === 'tenant') return `<span class="dot-s ok"></span>Saved key ending ${esc(p.key_hint || '••••')}`;
  if (p.key_source === 'env') return '<span class="dot-s env"></span>Using the Railway variable';
  return '<span class="dot-s"></span>No key yet';
}
function providerRow(block, p) {
  const editing = keyEdit === p.provider_id;
  const listId = `models-${p.provider_id}`;
  const peers = block.providers.filter(q => (q.role || '') === (p.role || '') && q.can_be_default).length;
  const imageCost = block.block_id === 'image' && p.is_default && image ? imageCostHint(p) : '';
  return `<div class="integ" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;">
    <div><div class="row-name">${esc(p.name)}${p.is_default && peers > 1 ? ' <span class="chip run" style="margin-left:6px;">Default</span>' : ''}${WIRED[p.wired] ? ` <span class="chip" style="margin-left:6px;">${WIRED[p.wired]}</span>` : ''}</div>
      ${p.note ? `<div class="row-meta" style="margin-top:1px;"><span>${esc(p.note)}</span></div>` : ''}</div>
    <div style="font-size:12px;">${p.can_be_default || p.can_save_key ? keyState(p) : ''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
      ${p.can_save_key ? `<button class="btn btn-secondary btn-sm" onclick="keyEdit=keyEdit==='${esc(p.provider_id)}'?'':'${esc(p.provider_id)}';render()">${p.key_source === 'tenant' ? 'Replace key' : 'Add key'}</button>`
                       : '<span class="hint" style="margin:0;">Railway variable only</span>'}
      ${peers > 1 && p.can_be_default && !p.is_default ? `<button class="btn btn-ghost btn-sm" onclick="makeDefault('${esc(block.block_id)}','${esc(p.provider_id)}')">Make default</button>` : ''}
    </div>
    ${p.models.length || block.block_id === 'image' ? `<div class="keyrow" style="grid-column:1 / -1;">
        <label class="label" style="margin:0;white-space:nowrap;" for="m-${esc(p.provider_id)}">Model</label>
        <input class="input" id="m-${esc(p.provider_id)}" maxlength="120" autocomplete="off" spellcheck="false" value="${esc(p.model)}" list="${esc(listId)}"
          onchange="saveModel('${esc(block.block_id)}','${esc(p.provider_id)}', this.value)">
        <datalist id="${esc(listId)}">${imageSuggestions(block, p).map(m => `<option value="${esc(m)}"></option>`).join('')}</datalist>
        ${imageCost ? `<span class="hint" style="margin:0;">${esc(imageCost)}</span>` : ''}</div>` : ''}
    ${editing ? `<div class="keyrow" style="grid-column:1 / -1;"><input class="input" id="key-input" type="password" autocomplete="new-password" spellcheck="false" placeholder="Paste a key — it is stored encrypted and never shown again" aria-label="API key">
      <button class="btn btn-primary btn-sm" onclick="saveKey('${esc(p.service_id)}')">Save</button>
      ${p.key_source === 'tenant' ? `<button class="btn btn-ghost btn-sm" onclick="removeKey('${esc(p.service_id)}')">Remove saved key</button>` : ''}</div>` : ''}
  </div>`;
}
function imageSuggestions(block, p) {
  if (block.block_id === 'image' && image) {
    const provider = p.provider_id === 'kie' ? 'kie' : 'openai';
    return [...new Set([image.default_models[provider], ...((image.known_models || {})[provider] || [])])].filter(Boolean);
  }
  return p.models;
}
function imageCostHint(p) {
  const costs = image.model_costs_usd || {};
  const model = p.model || '';
  const known = Object.prototype.hasOwnProperty.call(costs, model);
  const cost = known ? costs[model] : image.default_cost_usd;
  return cost == null ? '' : `About $${Number(cost).toFixed(3)} per image${known ? '' : ' (the general estimate)'}.`;
}
function blockCard(block) {
  const roleNote = block.roles.length > 1
    ? `<div class="hint" style="margin:0 0 10px;">Its providers do different jobs (${block.roles.join(' and ')}), so each is the default for its own job.</div>` : '';
  return `<div class="card"><div class="card-title">${esc(block.name)}</div>
    <div class="card-sub">${esc(block.description)}</div>${roleNote}
    ${block.providers.map(p => providerRow(block, p)).join('')}</div>`;
}
function viewIntegrations() {
  return `<div class="page-head"><div><h1>Integrations</h1><div class="sub">The services the pipeline calls, in five blocks. Each provider has its own key; a block with several providers has one default. Set once for the whole tenant.</div></div></div>
    ${blocks.can_save_keys ? '<div class="note">A key saved here wins over the Railway variable of the same service. Without one, the Railway variable is used.</div>'
      : '<div class="note warn">Keys cannot be saved yet: SETTINGS_ENCRYPTION_KEY is not set on Railway. Railway key variables still work.</div>'}
    ${blocks.blocks.map(blockCard).join('')}`;
}
async function saveKey(serviceId) {
  const key = $('key-input').value.trim();
  if (!key) return toast('Paste a key first.');
  await putService(serviceId, { api_key: key }, 'Key saved.');
}
async function removeKey(serviceId) {
  if (!confirm('Remove the saved key? The Railway variable is used again, if there is one.')) return;
  await putService(serviceId, { clear_key: true }, 'Saved key removed.');
}
async function putService(serviceId, body, msg) {
  try {
    const r = await api(`/platform/tenant/integrations/${encodeURIComponent(serviceId)}`, jsonOpts('PUT', body));
    if (!r.ok) throw new Error(await errorDetail(r));
    keyEdit = ''; showErr('');
    await loadIntegrations(); render(); toast(msg);
  } catch (e) { showErr(`Could not save: ${e.message}`); }
}
async function putBlock(blockId, body, msg) {
  try {
    const r = await api(`/platform/tenant/blocks/${encodeURIComponent(blockId)}`, jsonOpts('PUT', body));
    if (!r.ok) throw new Error(await errorDetail(r));
    blocks = await r.json(); showErr('');
    if (blockId === 'image') { const m = await api('/platform/tenant/settings/image'); image = m.ok ? await m.json() : image; }
    render(); toast(msg);
  } catch (e) { showErr(`Could not save: ${e.message}`); render(); }
}
const makeDefault = (blockId, providerId) => putBlock(blockId, { default: providerId }, 'Default changed.');
const saveModel = (blockId, providerId, model) => putBlock(blockId, { model: { provider: providerId, model: model.trim() } }, 'Model saved.');
async function loadIntegrations() {
  const [b, m] = await Promise.all([api('/platform/tenant/blocks'), api('/platform/tenant/settings/image')]);
  if (!b.ok) throw new Error(await errorDetail(b));
  blocks = await b.json(); image = m.ok ? await m.json() : null;
}

// ── Defaults ───────────────────────────────────────────────────────────────
const overriding = key => projects.filter(p => projectOverrides(p)[key] !== undefined).length;
function defaultField(key, label, map) {
  const n = overriding(key);
  return `<div class="field"><label class="label">${label}</label>
    <select class="select" onchange="saveDefault('${key}', this.value)">${opts(map, defaults[key])}</select>
    <div class="hint">${n ? `${n} of ${projects.length} projects override this` : 'Used by every project'}</div></div>`;
}
function viewDefaults() {
  return `<div class="narrow-wrap"><div class="page-head"><div><h1>Defaults</h1><div class="sub">What every project starts from. Order of precedence: the run, then the project, then these.</div></div></div>
    <div class="card"><div class="card-title">New projects and runs</div><div class="card-sub">Existing runs are not changed by an edit here.</div>
      <div class="grid2">${defaultField('language', 'Language', LANGS)}${defaultField('format', 'Format', FORMATS)}${defaultField('captions', 'Captions', CAPTIONS)}</div></div>
    <div class="card"><div class="card-title">Spend</div><div class="card-sub">A run stops generating AI images when it reaches the cap.</div>
      <div class="grid2"><div class="field"><label class="label" for="cap">AI image cap per run (USD)</label>
        <input class="input" id="cap" type="number" step="0.5" min="0" value="${esc(defaults.spend_cap)}" onchange="saveDefault('spend_cap', this.value)"></div></div></div></div>`;
}
async function saveDefault(key, value) {
  try {
    const r = await api('/platform/tenant/defaults', jsonOpts('PUT', { [key]: value }));
    if (!r.ok) throw new Error(await errorDetail(r));
    defaults = await r.json(); showErr(''); render(); toast('Saved. Projects that have not overridden it now use this.');
  } catch (e) { showErr(`Could not save: ${e.message}`); render(); }
}

function render() { $('view').className = 'wrap' + (TAB === 'defaults' ? ' narrow' : ''); $('view').innerHTML = TAB === 'defaults' ? viewDefaults() : viewIntegrations(); }

(async function init() {
  const label = TAB === 'defaults' ? 'Defaults' : 'Integrations';
  CFShell.mount({ active: 'settings:' + TAB, crumbs: [['Settings'], [label]] });
  document.title = `${label} — Content Factory`;
  try {
    if (TAB === 'defaults') {
      const [d, p] = await Promise.all([api('/platform/tenant/defaults'), api('/platform/projects')]);
      if (!d.ok) throw new Error(await errorDetail(d));
      defaults = await d.json(); projects = p.ok ? await p.json() : [];
    } else {
      await loadIntegrations();
    }
    render();
  } catch (e) {
    showErr(`Could not load settings: ${e.message}`);
    $('view').innerHTML = '';
  }
})();
</script>
</body>
</html>
