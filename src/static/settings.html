<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Content Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    /* Project list (P12-S2, D092). Same "Monochrome Console" tokens as studio-v2.html —
       a separate static page, not an addition to it. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --border: #E7E7E9; --border2: #F0F0F2;
      --ink: #121215; --ink-sub: #55555C; --muted: #8B8B92; --faint: #B4B4BA;
      --accent: #2E45EC; --accent-h: #1F33C9; --accent-tint: #EEF0FE; --accent-ring: rgba(46, 69, 236, 0.28);
      --red: #D92D20; --red-tint: #FEF1F0;
      --font: 'Schibsted Grotesk', system-ui, sans-serif; --mono: 'Fragment Mono', ui-monospace, monospace;
      --r: 8px; --r-sm: 6px;
    }
    body {
      font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--ink);
      background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    button, input { font-family: var(--font); }
    :focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; border-radius: 4px; }

    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 14px 40px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); position: relative; flex-shrink: 0; }
    .brand-mark::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); right: 5px; bottom: 5px; }
    .brand-name { font-weight: 700; letter-spacing: -0.01em; }
    .brand-name span { color: var(--muted); font-weight: 500; }
    .spacer { flex: 1; }

    .page { max-width: 760px; padding: 56px 40px 80px; }
    .page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .page-count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--r-sm);
      font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; line-height: 1; transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--faint); background: var(--border2); }
    .btn-ghost { background: transparent; color: var(--muted); font-weight: 500; }
    .btn-ghost:hover { color: var(--ink); background: var(--border2); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .form-row > div { flex: 1; min-width: 200px; }
    .label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
      font-size: 13px; color: var(--ink); background: var(--surface); transition: border-color 0.12s, box-shadow 0.12s;
    }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
    .input::placeholder { color: var(--faint); }

    .row {
      display: flex; align-items: center; gap: 16px; width: 100%; padding: 14px 18px; margin-bottom: 8px;
      text-align: left; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .row:hover { border-color: var(--faint); box-shadow: 0 2px 8px rgba(18,18,21,0.05); }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-count { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .row-arrow { color: var(--faint); flex-shrink: 0; }
    .row:hover .row-arrow { color: var(--ink); }

    .empty { text-align: center; padding: 72px 0 32px; }
    .empty-glyph { font-family: var(--mono); font-size: 13px; color: var(--faint); letter-spacing: 0.3em; margin-bottom: 16px; }
    .empty-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 13px; color: var(--muted); }

    .error-bar { padding: 10px 14px; border: 1px solid #F4C6C2; border-radius: var(--r-sm); background: var(--red-tint); color: var(--red); font-size: 13px; margin-bottom: 16px; }
    .notice { padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--accent-tint); color: var(--accent); font-size: 13px; margin-bottom: 16px; }
    .muted { color: var(--muted); }
    .back { display: inline-block; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 18px; }
    .back:hover { color: var(--ink); }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; background: var(--surface); color: var(--ink); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .saved-msg { font-size: 12px; color: var(--muted); margin-left: 10px; }
    .key-state { font-family: var(--mono); font-size: 12px; }

    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; }
      .page { padding: 28px 16px 64px; }
      .row { padding: 12px 14px; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand-mark" aria-hidden="true"></div>
  <div class="brand-name">CF <span>Studio</span></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" onclick="logOut()">Log out</button>
</header>

<main class="page">
  <a class="back" href="/">← All projects</a>
  <div class="page-head">
    <h1 class="page-title">Settings</h1>
  </div>

  <div id="error" class="error-bar" style="display:none;"></div>
  <div id="notice" class="notice" style="display:none;"></div>

  <form class="card" id="image-form" onsubmit="saveImageSettings(event)">
    <div class="card-title">AI image generation</div>
    <div class="card-sub">Used by Generate in a scene's edit-image dialog. Images are only generated when you press Generate — never automatically.</div>
    <div class="form-row">
      <div>
        <label class="label" for="img-provider">Provider</label>
        <select class="select" id="img-provider" onchange="renderKeyState()">
          <option value="kie">kie.ai</option>
          <option value="openai">OpenAI</option>
        </select>
      </div>
      <div>
        <label class="label" for="img-model">Model (optional)</label>
        <input class="input" id="img-model" maxlength="120" autocomplete="off" spellcheck="false">
        <div class="hint" id="img-model-hint"></div>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label class="label" for="img-key">API key</label>
        <input class="input" id="img-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="Paste a key to save or replace it">
        <div class="hint"><span class="key-state" id="key-state"></span></div>
      </div>
    </div>
    <button class="btn btn-primary" type="submit" id="img-save">Save</button>
    <button class="btn btn-ghost" type="button" id="img-clear" onclick="clearKey()" style="display:none;">Remove saved key</button>
    <span class="saved-msg" id="img-msg"></span>
  </form>
</main>

<script>
const API = '/platform/tenant/settings/image';
let current = null;

function showErr(msg) {
  const el = document.getElementById('error');
  el.textContent = msg || '';
  el.style.display = msg ? '' : 'none';
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { window.location.href = '/login'; throw new Error('Unauthorized'); }
  return r;
}
async function errorDetail(r) {
  const e = await r.json().catch(() => ({}));
  return typeof e.detail === 'string' ? e.detail : `Error ${r.status}`;
}
async function logOut() {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

// What the selected provider's key looks like right now: a key saved here, the
// Railway variable, or nothing. The key itself is never sent to the browser.
function renderKeyState() {
  const provider = document.getElementById('img-provider').value;
  const p = current.providers[provider];
  const el = document.getElementById('key-state');
  if (p.key_source === 'tenant') el.textContent = `Saved key ending ${p.key_hint || '••••'}`;
  else if (p.key_source === 'env') el.textContent = 'Using the key from the Railway variable';
  else el.textContent = 'No key yet';
  document.getElementById('img-clear').style.display = p.key_source === 'tenant' ? '' : 'none';
  document.getElementById('img-model').placeholder = current.default_models[provider] || '';
  document.getElementById('img-model-hint').textContent = `Empty uses ${current.default_models[provider] || 'the provider default'}.`;
}

function render() {
  document.getElementById('img-provider').value = current.provider;
  document.getElementById('img-model').value = current.model || '';
  document.getElementById('img-key').value = '';
  renderKeyState();
  const notice = document.getElementById('notice');
  if (!current.can_save_keys) {
    notice.textContent = 'Keys cannot be saved yet: SETTINGS_ENCRYPTION_KEY is not set on Railway. A Railway key variable still works.';
    notice.style.display = '';
  } else {
    notice.style.display = 'none';
  }
}

async function load() {
  try {
    const r = await api(API);
    if (!r.ok) throw new Error(await errorDetail(r));
    current = await r.json();
    render();
    showErr('');
  } catch (e) {
    showErr(`Could not load settings: ${e.message}`);
  }
}

async function put(body) {
  const btn = document.getElementById('img-save');
  btn.disabled = true;
  document.getElementById('img-msg').textContent = '';
  try {
    const r = await api(API, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await errorDetail(r));
    current = await r.json();
    render();
    document.getElementById('img-msg').textContent = '✓ saved';
    showErr('');
  } catch (e) {
    showErr(`Could not save: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

function saveImageSettings(event) {
  event.preventDefault();
  const body = {
    provider: document.getElementById('img-provider').value,
    model: document.getElementById('img-model').value.trim(),
  };
  const key = document.getElementById('img-key').value.trim();
  if (key) body.api_key = key;
  return put(body);
}

function clearKey() {
  if (!confirm('Remove the saved key for this provider?')) return;
  return put({ clear_key_for: document.getElementById('img-provider').value });
}

load();
</script>
</body>
</html>
