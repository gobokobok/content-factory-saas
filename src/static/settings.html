<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Content Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/app.css">
  <link rel="stylesheet" href="/ui/shell.css">
</head>
<body class="cf-body">
<div class="cf-shell" id="cf-shell">
  <aside class="cf-nav" id="cf-nav"></aside>
  <div class="cf-scrim" onclick="CFShell.closeNav()"></div>
  <div class="cf-main">
    <nav class="cf-crumbs" id="cf-crumbs" aria-label="Breadcrumb"></nav>
    <main class="cf-page">
      <div id="error" class="note err" style="display:none;"></div>
      <div class="wrap" id="view"><div class="muted">Loading…</div></div>
    </main>
  </div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/ui/shell.js"></script>
<script src="/ui/app.js"></script>
<script>
/* Tenant settings — Integrations (every service's key, plus the AI image provider) and
   Defaults (what every project inherits). Keys are never shown, only a four-character hint. */
const TAB = new URLSearchParams(location.search).get('tab') === 'defaults' ? 'defaults' : 'integrations';
let integrations = null, image = null, defaults = null, projects = [], keyEdit = '';

// ── Integrations ───────────────────────────────────────────────────────────
function keyState(s) {
  if (s.key_source === 'tenant') return `<span class="dot-s ok"></span>Saved key ending ${esc(s.key_hint || '••••')}`;
  if (s.key_source === 'env') return '<span class="dot-s env"></span>Using the Railway variable';
  return '<span class="dot-s"></span>No key yet';
}
function serviceRow(s) {
  const imageProvider = image && image.provider === s.service_id;
  const editing = keyEdit === s.service_id;
  return `<div class="integ" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;">
    <div><div class="row-name">${esc(s.name)}${imageProvider ? ' <span class="chip run" style="margin-left:6px;">image provider in use</span>' : ''}</div>
      <div class="row-meta" style="margin-top:1px;"><span>${esc(s.use)}</span></div></div>
    <div style="font-size:12px;">${keyState(s)}</div>
    ${s.can_save ? `<button class="btn btn-secondary btn-sm" onclick="keyEdit=keyEdit==='${esc(s.service_id)}'?'':'${esc(s.service_id)}';render()">${s.key_source === 'tenant' ? 'Replace key' : 'Add key'}</button>`
                 : '<span class="hint" style="margin:0;">Railway variable only</span>'}
    ${editing ? `<div class="keyrow"><input class="input" id="key-input" type="password" autocomplete="new-password" spellcheck="false" placeholder="Paste a key — it is stored encrypted and never shown again" aria-label="API key">
      <button class="btn btn-primary btn-sm" onclick="saveKey('${esc(s.service_id)}')">Save</button>
      ${s.key_source === 'tenant' ? `<button class="btn btn-ghost btn-sm" onclick="removeKey('${esc(s.service_id)}')">Remove saved key</button>` : ''}</div>` : ''}
  </div>`;
}
function imageCard() {
  if (!image) return '';
  const p = image.provider;
  const costs = image.model_costs_usd || {};
  const model = image.model || image.default_models[p] || '';
  const known = Object.prototype.hasOwnProperty.call(costs, model);
  const cost = known ? costs[model] : image.default_cost_usd;
  const costHint = cost == null ? '' : `Estimated $${Number(cost).toFixed(3)} per image${known ? '' : ' (the general estimate — this model has no price of its own)'}.`;
  const suggestions = [...new Set([...Object.keys(costs), ...Object.values(image.default_models || {})])].filter(Boolean);
  return `<div class="card"><div class="card-title">AI image generation</div>
    <div class="card-sub">Used by Generate on a scene and by Generate all images in an Animation run. Images are only generated when you start it — never automatically. The key for each provider is set below.</div>
    <div class="grid2">
      <div class="field"><label class="label" for="img-provider">Provider</label>
        <select class="select" id="img-provider" onchange="saveImage()">${opts({ kie: 'kie.ai', openai: 'OpenAI' }, p)}</select></div>
      <div class="field"><label class="label" for="img-model">Model (optional)</label>
        <input class="input" id="img-model" maxlength="120" autocomplete="off" spellcheck="false" value="${esc(image.model || '')}" placeholder="${esc(image.default_models[p] || '')}" list="img-model-list" onchange="saveImage()">
        <datalist id="img-model-list">${suggestions.map(m => `<option value="${esc(m)}"></option>`).join('')}</datalist>
        <div class="hint">Empty uses ${esc(image.default_models[p] || 'the provider default')}. ${esc(costHint)}</div></div>
    </div></div>`;
}
function viewIntegrations() {
  return `<div class="page-head"><div><h1>Integrations</h1><div class="sub">Every service the pipeline calls, with its key, set once for the whole tenant. Projects and runs use them; they never see a key.</div></div></div>
    ${integrations.can_save_keys ? '<div class="note">A key saved here wins over the Railway variable of the same service. Without one, the Railway variable is used.</div>'
      : '<div class="note warn">Keys cannot be saved yet: SETTINGS_ENCRYPTION_KEY is not set on Railway. Railway key variables still work.</div>'}
    ${imageCard()}
    ${integrations.services.map(serviceRow).join('')}`;
}
async function saveKey(id) {
  const key = $('key-input').value.trim();
  if (!key) return toast('Paste a key first.');
  await putService(id, { api_key: key }, 'Key saved.');
}
async function removeKey(id) {
  if (!confirm('Remove the saved key? The Railway variable is used again, if there is one.')) return;
  await putService(id, { clear_key: true }, 'Saved key removed.');
}
async function putService(id, body, msg) {
  try {
    const r = await api(`/platform/tenant/integrations/${encodeURIComponent(id)}`, jsonOpts('PUT', body));
    if (!r.ok) throw new Error(await errorDetail(r));
    integrations = await r.json(); keyEdit = ''; showErr(''); render(); toast(msg);
  } catch (e) { showErr(`Could not save: ${e.message}`); }
}
async function saveImage() {
  try {
    const r = await api('/platform/tenant/settings/image', jsonOpts('PUT', { provider: $('img-provider').value, model: $('img-model').value.trim() }));
    if (!r.ok) throw new Error(await errorDetail(r));
    image = await r.json(); showErr(''); render(); toast('Saved.');
  } catch (e) { showErr(`Could not save: ${e.message}`); }
}

// ── Defaults ───────────────────────────────────────────────────────────────
const overriding = key => projects.filter(p => projectOverrides(p)[key] !== undefined).length;
function defaultField(key, label, map) {
  const n = overriding(key);
  return `<div class="field"><label class="label">${label}</label>
    <select class="select" onchange="saveDefault('${key}', this.value)">${opts(map, defaults[key])}</select>
    <div class="hint">${n ? `${n} of ${projects.length} projects override this` : 'Used by every project'}</div></div>`;
}
function viewDefaults() {
  return `<div class="narrow-wrap"><div class="page-head"><div><h1>Defaults</h1><div class="sub">What every project starts from. Order of precedence: the run, then the project, then these.</div></div></div>
    <div class="card"><div class="card-title">New projects and runs</div><div class="card-sub">Existing runs are not changed by an edit here.</div>
      <div class="grid2">${defaultField('language', 'Language', LANGS)}${defaultField('format', 'Format', FORMATS)}${defaultField('captions', 'Captions', CAPTIONS)}</div></div>
    <div class="card"><div class="card-title">Spend</div><div class="card-sub">A run stops generating AI images when it reaches the cap.</div>
      <div class="grid2"><div class="field"><label class="label" for="cap">AI image cap per run (USD)</label>
        <input class="input" id="cap" type="number" step="0.5" min="0" value="${esc(defaults.spend_cap)}" onchange="saveDefault('spend_cap', this.value)"></div></div></div></div>`;
}
async function saveDefault(key, value) {
  try {
    const r = await api('/platform/tenant/defaults', jsonOpts('PUT', { [key]: value }));
    if (!r.ok) throw new Error(await errorDetail(r));
    defaults = await r.json(); showErr(''); render(); toast('Saved. Projects that have not overridden it now use this.');
  } catch (e) { showErr(`Could not save: ${e.message}`); render(); }
}

function render() { $('view').className = 'wrap' + (TAB === 'defaults' ? ' narrow' : ''); $('view').innerHTML = TAB === 'defaults' ? viewDefaults() : viewIntegrations(); }

(async function init() {
  const label = TAB === 'defaults' ? 'Defaults' : 'Integrations';
  CFShell.mount({ active: 'settings:' + TAB, crumbs: [['Settings'], [label]] });
  document.title = `${label} — Content Factory`;
  try {
    if (TAB === 'defaults') {
      const [d, p] = await Promise.all([api('/platform/tenant/defaults'), api('/platform/projects')]);
      if (!d.ok) throw new Error(await errorDetail(d));
      defaults = await d.json(); projects = p.ok ? await p.json() : [];
    } else {
      const [i, m] = await Promise.all([api('/platform/tenant/integrations'), api('/platform/tenant/settings/image')]);
      if (!i.ok) throw new Error(await errorDetail(i));
      integrations = await i.json(); image = m.ok ? await m.json() : null;
    }
    render();
  } catch (e) {
    showErr(`Could not load settings: ${e.message}`);
    $('view').innerHTML = '';
  }
})();
</script>
</body>
</html>
